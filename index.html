<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14181D"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>TESTE · Ficha do Rafael · Bloco 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: ficha de academia para usar no celular — abas por dia, cards de exercício empilhados, timer de descanso fixo embaixo. Cores dos dias = cores das anilhas olímpicas (25 vermelha, 20 azul, 15 amarela, 10 verde, 5 branca). */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --ink:#14181D; --muted:#5A636E; --line:#D3D8DE; --chip:#E1E5EA;
  --accent:#C8102E; --accent-ink:#FFFFFF;
  --p25:#C8102E; --p20:#1F4FA8; --p15:#D9A300; --p10:#1E8A4C; --p5:#7E8894;
  --ok:#1E8A4C; --warn:#B26A00;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101317; --surface:#191E24; --ink:#E7EAEE; --muted:#9AA3AE; --line:#2B323A; --chip:#232A31;
  --accent:#FF4D5E; --accent-ink:#14181D;
  --p25:#FF4D5E; --p20:#5C8DF0; --p15:#F2C230; --p10:#3DBF77; --p5:#A9B2BD;
  --ok:#3DBF77; --warn:#F2A33A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101317; --surface:#191E24; --ink:#E7EAEE; --muted:#9AA3AE; --line:#2B323A; --chip:#232A31;
  --accent:#FF4D5E; --accent-ink:#14181D;
  --p25:#FF4D5E; --p20:#5C8DF0; --p15:#F2C230; --p10:#3DBF77; --p5:#A9B2BD;
  --ok:#3DBF77; --warn:#F2A33A; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 140px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:2.3rem;font-weight:800;line-height:1;text-transform:uppercase}
h2{font-size:1.5rem;font-weight:700;text-transform:uppercase}
h3{font-size:1.25rem;font-weight:700}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:2px}
header{display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:1.15rem;font-weight:600}
.stat span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat small{font-size:.78rem;color:var(--muted)}
.who{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.who-lbl{font-family:var(--f-display);font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.who button{font:inherit;font-weight:600;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.who button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav{display:flex;flex-direction:column;gap:6px}
.navrow{display:grid;gap:6px}
.navrow.days{grid-template-columns:repeat(5,minmax(0,1fr))}
.navrow.info{grid-template-columns:repeat(4,minmax(0,1fr))}
nav button{min-width:0;font-family:var(--f-display);font-weight:700;font-size:.95rem;text-transform:uppercase;letter-spacing:.03em;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1;text-align:center}
nav button .wd{display:flex;align-items:center;gap:5px;font-size:1.05rem}
nav button .nm{font-size:.72rem;letter-spacing:.02em;opacity:.85;overflow-wrap:anywhere}
nav button .plate{width:10px;height:10px;border-radius:50%;background:var(--pc,var(--p5));box-shadow:inset 0 0 0 2px rgba(0,0,0,.15);flex:none}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pending{display:flex;flex-direction:column;gap:10px}
.alerta{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--warn);color:var(--warn);border-radius:3px;padding:0 5px;margin-right:4px}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--pc);padding-bottom:8px}
.dayhead p{margin:0;color:var(--muted)}
.ghost{font:inherit;font-size:.85rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer}
.list{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ex.done{border-color:var(--ok)}
.ex-top{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.ex-n{font-family:var(--f-mono);font-weight:600;color:var(--pc);font-size:1.05rem;line-height:1.6}
.ex-name{font-weight:600;font-size:1.05rem;min-width:0}
.presc{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--f-mono);font-size:.8rem;background:var(--chip);border-radius:4px;padding:1px 7px;white-space:nowrap}
.tag.drop{background:var(--accent);color:var(--accent-ink)}
.sets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg);font-family:var(--f-mono);font-weight:600;cursor:pointer;color:var(--muted);user-select:none}
.set[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:var(--surface)}
details{border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted);list-style:none}
summary::before{content:"+ ";font-family:var(--f-mono)}
details[open] summary::before{content:"− "}
details ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.breno{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);border-radius:3px;padding:0 5px;margin-right:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel p,.panel ul{margin:0}
.panel ul{padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;color:var(--muted)}
td.num,th.num{text-align:right}
.ok{color:var(--ok);font-weight:600}.warn{color:var(--warn);font-weight:600}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.timer-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:1.9rem;font-weight:600;min-width:5ch;font-variant-numeric:tabular-nums}
.clock.zero{color:var(--p10)}
.timer button{font-family:var(--f-mono);font-weight:600;font-size:.9rem;background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:6px;padding:6px 10px;cursor:pointer}
.timer .lbl{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:.8rem;opacity:.75}
.bar{height:3px;background:color-mix(in srgb,var(--bg) 20%,transparent);flex-basis:100%;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--p10)}
footer{color:var(--muted);font-size:.8rem}
.logbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.logbar input{font:inherit;font-family:var(--f-mono);font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
#logstate{font-size:.8rem;color:var(--ok)}
#logstate.local{color:var(--muted)}
#logstate.nostore{color:var(--warn);font-weight:600}
.sendbox h3{margin:0}
.sendsum{color:var(--muted)}
.sendrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-wa{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:8px;background:var(--ok);color:var(--surface);font-weight:700;text-decoration:none;flex:1 1 200px}
.sendrow .ghost{min-height:48px;padding:0 16px;font-size:.95rem}
.sendtxt{width:100%;min-height:8rem;font-family:var(--f-mono);font-size:.85rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
/* Séries: uma linha por série — número, kg, reps e o ✓ que marca e inicia o descanso */
.last{margin:0;font-size:.85rem;color:var(--muted)}
.last b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.lg{display:grid;grid-template-columns:2rem minmax(0,1fr) minmax(0,1fr) 3rem;gap:6px 8px;align-items:center}
.lg .h{font-family:var(--f-display);font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.lg .h:first-child{text-align:left}
.lg .sn{font-family:var(--f-mono);font-weight:600;color:var(--pc);font-size:1.05rem}
.lg input{width:100%;min-width:0;height:44px;font-family:var(--f-mono);font-size:1.05rem;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 6px;text-align:center}
.lg input::placeholder{color:var(--muted);opacity:.55;font-weight:500}
.lg input:focus{border-color:var(--pc);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 30%,transparent)}
.lg .set{width:100%;height:44px;border-radius:8px;font-size:1.25rem}
.lg .set[aria-pressed="true"]{color:var(--surface)}
.meta{margin:0;font-size:.9rem;color:var(--ink)}
.meta b{font-family:var(--f-mono);font-weight:600;color:var(--pc)}
.lg .sn.extra{color:var(--muted)}
.addset{align-self:flex-start;min-height:40px}
.lg input.ok{background:color-mix(in srgb,var(--pc) 12%,var(--surface));border-color:color-mix(in srgb,var(--pc) 45%,var(--line))}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .9s linear}}
/* Celular: cabeçalho compacto para o 1º exercício aparecer na tela, letra maior, timer numa linha só */
@media (max-width:600px){
  body{font-size:16px}
  .wrap{gap:14px;padding-block:12px 96px}
  .who-lbl{display:none}
  .who button{font-size:.95rem;padding:6px 14px}
  h1{font-size:1.9rem}
  header{gap:8px}
  .stats{display:flex;overflow-x:auto;gap:6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  .stat{flex:0 0 auto;padding:6px 10px}
  .stat b{font-size:1.05rem}
  nav button{padding:8px 2px}
  nav button .wd{font-size:1.1rem}
  nav button .nm{font-size:.7rem;letter-spacing:0;white-space:nowrap;overflow-wrap:normal}
  .ex{padding:14px;gap:12px}
  .ex-n{font-size:1.15rem}
  .ex-name{font-size:1.2rem;line-height:1.35}
  .tag{font-size:.92rem;padding:2px 8px}
  .sets .set{width:50px;height:50px;font-size:1.1rem}
  .lg input,.lg .set{height:48px}
  summary{font-size:1rem;padding-block:4px}
  details ul{gap:8px}
  .panel{padding:14px}
  table{font-size:.95rem}
  .timer{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
  .timer-in{flex-wrap:nowrap;gap:6px}
  .timer .lbl{display:none}
  .clock{font-size:1.6rem;min-width:4.2ch}
  .timer button{flex:1 1 0;min-width:0;padding:9px 2px;font-size:.85rem}
  .bar{position:absolute;top:0;left:0;right:0;border-radius:0}
}
.navrow.info{grid-template-columns:repeat(2,minmax(0,1fr))}
.envbar{background:var(--warn);color:var(--surface);font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:6px 12px;border-radius:6px}
</style>

<div class="wrap">
  <div class="envbar" role="note">Ambiente de teste · dados separados dos treinos de verdade</div>

</div>

function renderDay(d){

    const [name,sets,reps,rir,rest,flag,cues] = e;
    const log = rir !== "—";
    const boxes = log ? setRows(d, i, name, sets, marks, reps) : `<div class="sets">${Array.from({length:sets},(_,s)=>
      `<button type="button" class="set" data-ex="${i}" data-s="${s}" aria-pressed="${!!marks[i+"-"+s]}" aria-label="Série ${s+1} de ${name}">${s+1}</button>`).join("")}</div>`;
    const allDone = Array.from({length:sets}).every((_,s)=>marks[i+"-"+s]);
    return `<article class="ex${allDone?" done":""}" id="ex-${d.id}-${i}">
      <div class="ex-top">
        <span class="ex-n">${String(i+1).padStart(2,"0")}</span>
        <h3 class="ex-name">${name}</h3>
        <div class="presc">
          <span class="tag">${sets} × ${reps}</span>
          ${rir==="—" ? "" : `<span class="tag">${rir==="0" ? "até a falha" : "sobrar "+rir}</span>`}
          ${rest ? `<span class="tag">${fmt(rest)} descanso</span>` : ""}
          ${flag?`<span class="tag drop">${flag}</span>`:""}
        </div>
      </div>
      ${log ? `<p class="last" data-name="${esc(name)}"></p><p class="meta" hidden></p>` : ""}
      ${boxes}
      <details><summary>Execução</summary><ul>${cues.map(c=>`<li>${c}</li>`).join("")}</ul></details>
    </article>`;
  }).join("");
  const total = d.ex.reduce((a,e)=>a+(e[4] ? e[1] : 0),0);
  return `<section style="--pc:var(${d.plate})" class="list">

}

function treinoText(){
  const d = person.days?.find(x => x.id === current), doc = LOGS[docId(person.id, logDate)];
  if (!d || !doc) return "";
  const lines = d.ex.map((e, i) => {
    const t = (doc.ex?.[e[0]]?.sets || []).map(s => filled(s) ? `${num(s.kg) || "–"}×${s.reps === "" || s.reps == null ? "–" : s.reps}` : s.done ? "✓" : "").filter(Boolean).join(" · ");
    return t ? `${i+1}. ${e[0]}: ${t}` : "";
  }).filter(Boolean);
  return lines.length ? `Treino ${person.name} · ${d.wd} ${brDate(logDate)} · ${d.name}\n${lines.join("\n")}` : "";
}

function lastFor(p, name, before){
  let best = null;
  for (const d of Object.values(LOGS)) {
    if (!d || d.person !== p || !(d.date < before)) continue;
    const e = d.ex && d.ex[name];
    if (!e || !(e.sets || []).some(filled)) continue;
    if (!best || d.date > best.date) best = {date:d.date, sets:e.sets};
  }
  return best;
}

// Meta do dia pela dupla progressão: bateu o topo da faixa em todas as séries → sobe a carga; senão, mesma carga buscando o topo.
// No graviton o peso é ajuda: progredir é tirar peso.
function metaFor(last, reps, sets, leg, name){
  const m = String(reps).match(/(\d+)\s*[–-]\s*(\d+)/); if (!m || !last) return "";
  const lo = +m[1], hi = +m[2], help = /Graviton/.test(name);
  const ok = (last.sets || []).filter(s => typeof s.kg === "number" && typeof s.reps === "number" && s.reps > 0);
  if (!ok.length) return "";
  const inRange = ok.filter(s => s.reps >= lo);
  if (!inRange.length) {
    const ref = help ? Math.max(...ok.map(s => s.kg)) : Math.min(...ok.map(s => s.kg));
    return `<b>${num(ref)} kg</b>, buscando ${lo}–${hi} reps (se não sair ${lo}, ${help ? "aumente a ajuda" : "tire uns 10%"})`;
  }
  const ref = help ? Math.min(...inRange.map(s => s.kg)) : Math.max(...inRange.map(s => s.kg));
  const top = ok.filter(s => (help ? s.kg <= ref : s.kg >= ref) && s.reps >= hi).length >= sets;
  if (!top) return `<b>${num(ref)} kg</b>, buscando ${hi} reps em todas as séries`;
  const step = help ? 2.5 : /halter/i.test(name) ? (ref < 10 ? 1 : 2) : leg && ref >= 20 ? 5 : 2.5;
  const next = Math.max(0, help ? ref - step : ref + step);
  return `<b>${num(next)} kg</b> × ${lo}–${hi} (${help ? "menos ajuda" : "subiu"}: bateu ${hi} em todas)`;
}

    if (p) p.innerHTML = last ? `Última vez (${brDate(last.date)}): <b>${fmtSets(last.sets)}</b>` : "Primeira vez: anote kg e reps de cada série.";
    const mt = box.parentElement.querySelector(".meta");
    if (mt) { const t = metaFor(last, box.dataset.reps, +box.dataset.sets, box.dataset.leg === "true", name); mt.innerHTML = t ? `Meta de hoje: ${t}` : ""; mt.hidden = !t; }
    box.querySelectorAll("input").forEach(inp => {

// Grava um pedaço de uma série (kg, reps ou feita) no treino da pessoa nesta data
function writeSet(name, n, s, patch){
  const id = docId(person.id, logDate);
  const doc = LOGS[id] ? JSON.parse(JSON.stringify(LOGS[id])) : {person:person.id, date:logDate, day:current, ex:{}};
  const e = doc.ex[name] || (doc.ex[name] = {sets:[]});
  while (e.sets.length < Math.max(n, s + 1)) e.sets.push({kg:"", reps:""});
  Object.assign(e.sets[s], patch);

}
function saveLog(id){
  chains[id] = (chains[id] || Promise.resolve()).then(async () => {
    const body = LOGS[id];
    store.set("cargas:" + id, body);   // cópia no aparelho até o banco confirmar
    if (logMode === "online" && dbRef) {
      for (let t = 0; t < 2; t++) {
        try { await dbRef.collection("treinos").doc(id).set(body); delete pending[id]; try { localStorage.removeItem("cargas:" + id); } catch(e) {} setStatus("Salvo online ✓"); return; }
        catch(e) { if (SUPA || !(e && e.code === "unavailable") || t) break; await new Promise(r => setTimeout(r, 400 + Math.random()*600)); }
      }

// Treinos que ficaram no aparelho sobem para o banco quando ele fica disponível (o mais novo vence)
const ts = s => Date.parse(s || 0) || 0;
function syncLocal(server){
  let keys = [];
  try { for (let k = 0; k < localStorage.length; k++) { const key = localStorage.key(k); if (key && key.startsWith("cargas:")) keys.push(key.slice(7)); } } catch(e) { return; }
  for (const id of keys) if (LOGS[id] && !(server[id] && ts(server[id].updated) >= ts(LOGS[id].updated))) saveLog(id);
}
// Versão do site (GitHub Pages): o banco é o Supabase do Rafael, sem login para ninguém
const SUPA = window.SUPA || null;
function supaDb(){
  const h = {apikey: SUPA.key, Authorization: "Bearer " + SUPA.key, "Content-Type": "application/json"};
  const ref = {
    doc: id => ({ async set(b){
      const r = await fetch(`${SUPA.url}/rest/v1/${SUPA.table || "treinos"}?on_conflict=id`, {method: "POST", headers: {...h, Prefer: "resolution=merge-duplicates,return=minimal"},
        body: JSON.stringify({id, person: b.person, date: b.date, day: b.day, ex: b.ex, updated: b.updated})});
      if (!r.ok) throw {code: "unavailable"};
    }}),
    orderBy: () => ref, limit: () => ref,
    onSnapshot(next){
      const load = async () => { try {
        const r = await fetch(`${SUPA.url}/rest/v1/${SUPA.table || "treinos"}?select=*&order=date.desc&limit=1000`, {headers: h});
        if (!r.ok) return;
        const rows = await r.json();
        next({docs: rows.map(x => ({id: x.id, data: () => ({person: x.person, date: x.date, day: x.day, ex: x.ex, updated: x.updated})})), metadata: {fromCache: false}});
      } catch(e) {} };
      load(); setInterval(load, 60000);
      addEventListener("online", load);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
    }
  };
  return {collection: () => ref};
}
(async () => {
  await null;   // espera o resto do script (pessoa e dia) existir antes de desenhar
  let db = null;
  if (SUPA) db = supaDb();
  else try { db = await window.claude?.use?.("db"); } catch(e) {}
  if (!db) { logMode = "local"; refreshCarga(); return; }
  dbRef = db; logMode = "online"; refreshCarga();
  db.collection("treinos").orderBy("date", "desc").limit(500).onSnapshot(snap => {
    const server = {};
    for (const d of snap.docs) {
      const v = d.data(); server[d.id] = v;
      if (!pending[d.id] && !(LOGS[d.id] && ts(LOGS[d.id].updated) > ts(v.updated))) LOGS[d.id] = v;
    }
    if (!snap.metadata.fromCache) syncLocal(server);
    refreshCarga();
  }, () => { logMode = "local"; refreshCarga(); });
})();

    const d = person.days.find(x=>x.id===current), i = +set.dataset.ex, [, n, , , rest] = d.ex[i];
    set.setAttribute("aria-pressed", String(m[key]));
    set.closest(".lg")?.querySelectorAll(`input[data-set="${set.dataset.s}"]`).forEach(x => x.classList.toggle("ok", m[key]));
    set.closest(".ex").classList.toggle("done", Array.from({length:n}).every((_, s) => m[i+"-"+s]));
    if (m[key] && set.closest(".lg")) autofill(set);
    if (set.closest(".lg")) writeSet(d.ex[i][0], n, +set.dataset.s, {done: m[key]});
    if (m[key] && rest) startTimer(rest);
    return;
  }
  if (e.target.id==="reset"){ const k = markKey(current); MARKS[k] = {}; store.set(k, {}); draw(); }
});

// Timer
const clock = document.getElementById("clock"), fill = document.getElementById("barfill");
let endAt = 0, total = 0, tick = null, actx = null;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(t=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.2, actx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+t+0.2);
      o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.2);
    });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
function startTimer(sec){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume && actx.resume(); }catch(e){}
  total = sec; endAt = Date.now() + sec*1000; clock.classList.remove("zero");
  clearInterval(tick); update(); tick = setInterval(update, 250);
}
function update(){
  const left = Math.max(0, Math.ceil((endAt - Date.now())/1000));
  clock.textContent = fmt(left);
  fill.style.width = total ? ((total-left)/total*100)+"%" : "0";
  if (left===0 && tick){ clearInterval(tick); tick=null; clock.classList.add("zero"); clock.textContent="Vai!"; beep(); }
}
document.querySelectorAll(".timer [data-t]").forEach(bt=>bt.addEventListener("click",()=>startTimer(+bt.dataset.t)));
document.getElementById("stop").addEventListener("click",()=>{ clearInterval(tick); tick=null; total=0; clock.textContent="0:00"; clock.classList.remove("zero"); fill.style.width="0"; });

draw();
</script>

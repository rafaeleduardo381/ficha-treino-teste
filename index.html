<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14181D"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>TESTE · Ficha do Rafael · Bloco 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de academia para o celular, escuro. Tela "Hoje" (semana + check-in de água e sono + treino do dia),
   tela "Treino" (ficha do dia com séries) e "Mais"; menu flutuante embaixo, timer flutuante só no treino.
   Cores dos dias = anilhas (25 vermelha, 20 azul, 15 amarela, 10 verde, 5 roxa). */
:root{
  --bg:#0D0E10; --surface:#17181B; --surface2:#222428; --ink:#F3F4EF; --soft:#D5D7D0; --muted:#8E929A; --line:#2A2D32;
  --lime:#C6F24E; --lime-ink:#151708; --violet:#A68BFF; --coral:#FF6A4D;
  --accent:var(--lime); --accent-ink:var(--lime-ink);
  --p25:#FF6A4D; --p20:#6E9BFF; --p15:#F4C542; --p10:#C6F24E; --p5:#A68BFF;
  --ok:#C6F24E; --warn:#FFB547;
  --f-display:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:22px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 120px;display:flex;flex-direction:column;gap:20px}
body.has-timer .wrap{padding-bottom:190px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:800;line-height:1.1}
h2{font-size:1.35rem;font-weight:800;line-height:1.2}
h3{font-size:1.05rem;font-weight:700}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--lime);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* Topo: saudação e pessoa */
.top{display:flex;flex-direction:column;gap:14px}
.hello{display:flex;flex-direction:column;gap:4px}
.who{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.who::-webkit-scrollbar{display:none}
.who button{flex:none;font:inherit;font-weight:700;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 9px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.wday span{font-size:.72rem;color:var(--muted);font-weight:700}
.wday b{font-size:1.1rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.wday.today:not(.on){border-color:var(--muted)}
.wday.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.wday.on span{color:var(--lime-ink)}
.dot{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--lime) calc(var(--p,0)*1%),var(--surface2) 0);position:relative}
.dot::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.wday.on .dot{background:conic-gradient(var(--lime-ink) calc(var(--p,0)*1%),color-mix(in srgb,var(--lime-ink) 22%,transparent) 0)}
.wday.on .dot::after{background:var(--lime)}

/* Check-in */
.sec{display:flex;align-items:center;gap:10px;font-size:1.25rem}
.count{font-size:.75rem;font-weight:800;color:var(--muted);background:var(--surface2);border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ck{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.ck-h{align-self:stretch;display:flex;align-items:center;gap:10px;font-weight:800}
.ico{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--c)}
.ico svg{width:18px;height:18px}
.ring{position:relative;width:min(132px,100%);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .track{stroke:var(--surface2)}
.ring .val{stroke:var(--c)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lbl b{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.ring .lbl small{font-size:.75rem;color:var(--muted)}
.step{display:flex;align-items:center;background:var(--surface2);border-radius:14px;overflow:hidden}
.step button{width:54px;height:46px;border:0;background:none;color:var(--ink);font-size:1.5rem;line-height:1;cursor:pointer}
.step button+button{border-left:1px solid var(--line);color:var(--lime)}
.ck-note{font-size:.75rem;color:var(--muted);text-align:center;margin:0}
.ckstate{font-size:.8rem;color:var(--muted);margin:0}
.todaycard{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--ink);font:inherit;cursor:pointer}
.todaycard .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.todaycard p{margin:0;color:var(--muted);font-size:.9rem}
.pbar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pc,var(--lime));border-radius:99px}
.go{width:42px;height:42px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;flex:none}
.go svg{width:20px;height:20px}

/* Menu flutuante */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:6px;align-items:center;background:color-mix(in srgb,var(--surface2) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.dock button{display:flex;align-items:center;gap:8px;height:52px;min-width:56px;justify-content:center;padding:0 16px;border:0;border-radius:999px;background:none;color:var(--muted);font:inherit;font-weight:800;font-size:.95rem;cursor:pointer}
.dock button svg{width:22px;height:22px;flex:none}
.dock button span{display:none}
.dock button[aria-current="page"]{background:var(--lime);color:var(--lime-ink);padding:0 22px}
.dock button[aria-current="page"] span{display:inline}

/* Mais */
.menu{display:flex;flex-direction:column;gap:10px}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);color:var(--ink);font:inherit;font-weight:800;font-size:1.05rem;text-align:left;cursor:pointer}
.menu small{display:block;font-weight:500;color:var(--muted);font-size:.85rem}
.back{align-self:flex-start}

/* Dias do treino */
nav.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
nav.days button{min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
nav.days .wd{font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:5px}
nav.days .nm{font-size:.66rem;font-weight:600;color:var(--muted);white-space:nowrap}
nav.days .plate{width:8px;height:8px;border-radius:50%;background:var(--pc);flex:none}
nav.days button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.days button[aria-selected="true"] .nm{color:var(--bg)}

/* Ficha do dia */
.list{display:flex;flex-direction:column;gap:12px}
.pending{display:flex;flex-direction:column;gap:12px}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dayhead .eyebrow{color:var(--pc,var(--muted))}
.dayhead p{margin:0;color:var(--muted)}
.ghost{font:inherit;font-size:.85rem;font-weight:700;background:var(--surface2);border:0;color:var(--soft);border-radius:10px;padding:8px 12px;cursor:pointer}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ex.done{border-color:color-mix(in srgb,var(--lime) 55%,var(--line))}
.ex-top{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start}
.ex-n{font-family:var(--f-mono);font-weight:600;color:var(--pc);font-size:1rem;line-height:1.7}
.ex-name{font-size:1.1rem;font-weight:800;min-width:0;line-height:1.35}
.presc{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8rem;font-weight:700;background:var(--surface2);color:var(--soft);border-radius:8px;padding:3px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.drop{background:var(--coral);color:#1A0B06}
.last{margin:0;font-size:.85rem;color:var(--muted)}
.last b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.meta{margin:0;font-size:.9rem;color:var(--soft)}
.meta b{font-weight:800;color:var(--lime)}
.lg{display:grid;grid-template-columns:2rem minmax(0,1fr) minmax(0,1fr) 3.2rem;gap:8px;align-items:center}
.lg .h{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.lg .h:first-child{text-align:left}
.lg .sn{font-family:var(--f-mono);font-weight:600;color:var(--pc);font-size:1.05rem}
.lg .sn.extra{color:var(--muted)}
.lg input{width:100%;min-width:0;height:48px;font:inherit;font-size:1.1rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 6px;text-align:center}
.lg input::placeholder{color:var(--muted);opacity:.6;font-weight:600}
.lg input:focus{border-color:var(--lime);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--lime) 30%,transparent)}
.lg input.ok{background:color-mix(in srgb,var(--lime) 10%,var(--surface));border-color:color-mix(in srgb,var(--lime) 40%,var(--line))}
.set{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--bg);font:inherit;font-weight:800;cursor:pointer;color:var(--muted);user-select:none}
.lg .set{width:100%;border-radius:12px;font-size:1.2rem}
.set[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.sets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addset{align-self:flex-start}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";font-family:var(--f-mono)}
details[open] summary::before{content:"− "}
details ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.92rem;color:var(--soft)}
.breno{display:inline-block;font-weight:800;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--lime);color:var(--lime);border-radius:6px;padding:0 5px;margin-right:5px}
.alerta{display:inline-block;font-weight:800;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--warn);color:var(--warn);border-radius:6px;padding:0 5px;margin-right:5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel p,.panel ul{margin:0}
.panel ul{padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--soft)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.ok{color:var(--lime);font-weight:700}.warn{color:var(--warn);font-weight:700}
.logbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.logbar input{font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
#logstate{font-size:.8rem;color:var(--lime)}
#logstate.local{color:var(--muted)}
#logstate.nostore{color:var(--warn);font-weight:700}
.sendbox h3{margin:0}
.sendsum{color:var(--muted)}
.sendrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-wa{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:14px;background:var(--lime);color:var(--lime-ink);font-weight:800;text-decoration:none;flex:1 1 200px}
.sendrow .ghost{min-height:48px;padding:0 16px}
.sendtxt{width:100%;min-height:8rem;font-family:var(--f-mono);font-size:.85rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px}

/* Timer de descanso (só na tela de treino) */
.timer{position:fixed;left:50%;transform:translateX(-50%);width:min(536px,calc(100% - 24px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 10px 10px;box-shadow:0 8px 24px rgba(0,0,0,.45);overflow:hidden}
.timer-in{display:flex;align-items:center;gap:6px}
.timer .lbl{display:none}
.clock{font-family:var(--f-mono);font-size:1.5rem;font-weight:600;min-width:4.4ch;font-variant-numeric:tabular-nums}
.clock.zero{color:var(--lime)}
.timer button{flex:1 1 0;min-width:0;font:inherit;font-weight:700;font-size:.85rem;background:var(--surface2);color:var(--ink);border:0;border-radius:10px;padding:9px 2px;cursor:pointer}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px}
.bar i{display:block;height:100%;width:0;background:var(--lime)}
footer{color:var(--muted);font-size:.78rem;text-align:center}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .9s linear}.ring .val{transition:stroke-dashoffset .4s ease}}
@media (max-width:380px){.cards{gap:8px}.ck{padding:14px 10px}.step button{width:44px}}
.navrow.info{grid-template-columns:repeat(2,minmax(0,1fr))}
.envbar{background:var(--warn);color:#1A1205;font-family:var(--f-display);font-weight:800;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:5px 12px;border-radius:999px}
</style>

<div class="wrap">
  <div class="envbar" role="note">Ambiente de teste</div>
  <header class="top">
    <div class="hello" id="head"></div>
    <div class="who" id="who" role="group" aria-label="Ficha de quem"></div>
  </header>
  <nav id="tabs" class="days" role="tablist" aria-label="Dias de treino"></nav>
  <main id="view"></main>
  <footer>Montado pelo seu personal (Claude) com base em meta-análises 2017–2026 e nas execuções do Breno Aceti.</footer>
</div>

<div class="timer" id="timer" role="region" aria-label="Timer de descanso" hidden>
  <div class="timer-in">
    <span class="lbl">Descanso</span>
    <span class="clock" id="clock">0:00</span>
    <button type="button" data-t="60">60s</button>
    <button type="button" data-t="90">90s</button>
    <button type="button" data-t="120">2min</button>
    <button type="button" data-t="180">3min</button>
    <button type="button" id="stop">Parar</button>
  </div>
  <div class="bar"><i id="barfill"></i></div>
</div>

<nav class="dock" id="dock" aria-label="Menu">

</nav>

const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

function renderDay(d){
  const marks = getMarks(markKey(d.id));
  const cards = d.ex.map((e,i)=>{
    const [name,sets,reps,rir,rest,flag,cues] = e;
    const log = rir !== "—";
    const boxes = log ? setRows(d, i, name, sets, marks, reps) : `<div class="sets">${Array.from({length:sets},(_,s)=>
      `<button type="button" class="set" data-ex="${i}" data-s="${s}" aria-pressed="${!!marks[i+"-"+s]}" aria-label="Série ${s+1} de ${name}">${s+1}</button>`).join("")}</div>`;
    const allDone = Array.from({length:sets}).every((_,s)=>marks[i+"-"+s]);
    return `<article class="ex${allDone?" done":""}" id="ex-${d.id}-${i}">
      <div class="ex-top">
        <span class="ex-n">${String(i+1).padStart(2,"0")}</span>
        <h3 class="ex-name">${name}</h3>
        <div class="presc">
          <span class="tag">${sets} × ${reps}</span>
          ${rir==="—" ? "" : `<span class="tag">${rir==="0" ? "até a falha" : "sobrar "+rir}</span>`}
          ${rest ? `<span class="tag">${fmt(rest)} descanso</span>` : ""}
          ${flag?`<span class="tag drop">${flag}</span>`:""}
        </div>
      </div>
      ${log ? `<p class="last" data-name="${esc(name)}"></p><p class="meta" hidden></p>` : ""}
      ${boxes}
      <details><summary>Execução</summary><ul>${cues.map(c=>`<li>${c}</li>`).join("")}</ul></details>
    </article>`;
  }).join("");
  const total = d.ex.reduce((a,e)=>a+(e[4] ? e[1] : 0),0);
  return `<section style="--pc:var(${d.plate})" class="list">
    <div class="dayhead"><div><div class="eyebrow">${d.wd} · ${d.sub}</div><h2>${d.name}</h2></div>
    <div style="display:flex;gap:8px;align-items:center"><span class="num" style="color:var(--muted)">${total} séries</span><button type="button" class="ghost" id="reset">Zerar marcações</button></div></div>
    <div class="logbar"><label for="logdate">Treino de</label><input type="date" id="logdate" value="${logDate}"><span id="logstate" aria-live="polite">${modeText()}</span></div>
    ${cards}
    ${SUPA ? "" : `<div class="panel sendbox"><h3>Terminou?</h3>
      <p id="sendsum" class="sendsum"></p>
      <div class="sendrow"><a class="btn-wa" id="sendwa" href="https://wa.me/" target="_blank" rel="noopener">Enviar no WhatsApp</a><button type="button" class="ghost" id="copytxt">Copiar texto</button></div>
      <textarea id="sendtxt" class="sendtxt" readonly hidden aria-label="Texto do treino"></textarea>
    </div>`}
  </section>`;
}
// Texto do treino do dia para mandar no WhatsApp ou colar no chat do personal
function treinoText(){
  const d = person.days?.find(x => x.id === current), doc = LOGS[docId(person.id, logDate)];
  if (!d || !doc) return "";
  const lines = d.ex.map((e, i) => {
    const t = (doc.ex?.[e[0]]?.sets || []).map(s => filled(s) ? `${num(s.kg) || "–"}×${s.reps === "" || s.reps == null ? "–" : s.reps}` : s.done ? "✓" : "").filter(Boolean).join(" · ");
    return t ? `${i+1}. ${e[0]}: ${t}` : "";
  }).filter(Boolean);
  return lines.length ? `Treino ${person.name} · ${d.wd} ${brDate(logDate)} · ${d.name}\n${lines.join("\n")}` : "";
}
function refreshSend(){
  const el = document.getElementById("sendsum"); if (!el) return;
  const t = treinoText(), n = t ? t.split("\n").length - 1 : 0;
  el.textContent = n ? `${n} exercício${n > 1 ? "s" : ""} anotado${n > 1 ? "s" : ""}. Mande para o personal no WhatsApp.` : "Anote as séries e mande o treino para o personal no WhatsApp.";
}

function lastFor(p, name, before){
  let best = null;
  for (const d of Object.values(LOGS)) {
    if (!d || d.person !== p || !(d.date < before)) continue;
    const e = d.ex && d.ex[name];
    if (!e || !(e.sets || []).some(filled)) continue;
    if (!best || d.date > best.date) best = {date:d.date, sets:e.sets};
  }
  return best;
}
const addRows = {};   // séries a mais abertas pelo botão "+ série" (por pessoa, data e exercício)
function setRows(d, i, name, sets, marks, reps){
  const cur = (LOGS[docId(person.id, logDate)]?.ex?.[name]?.sets) || [];
  const k = `${person.id}:${logDate}:${name}`;
  const kgLbl = /halter|búlgaro|martelo/i.test(name) ? "kg/halter" : "kg";   // halter: anota o peso de um halter só
  const total = Math.max(sets, cur.length, sets + (addRows[k] || 0));
  const rows = Array.from({length:total}, (_, s) => {
    const v = cur[s] || {}, on = !!(marks[i+"-"+s] ?? v.done), a = `data-name="${esc(name)}" data-set="${s}" data-n="${total}"`;
    return `<span class="sn${s >= sets ? " extra" : ""}">${s+1}</span>

  }).join("");
  const leg = d.id === "d2" || d.id === "d4";
  return `<div class="lg" data-name="${esc(name)}" data-reps="${esc(reps)}" data-sets="${sets}" data-leg="${leg}" data-kg="${kgLbl}"><span class="h">Série</span><span class="h">${kgLbl}</span><span class="h">Reps</span><span class="h">Feita</span>${rows}</div>

}
// Meta do dia pela dupla progressão: bateu o topo da faixa em todas as séries → sobe a carga; senão, mesma carga buscando o topo.
// No graviton o peso é ajuda: progredir é tirar peso.
function metaFor(last, reps, sets, leg, name){
  const m = String(reps).match(/(\d+)\s*[–-]\s*(\d+)/); if (!m || !last) return "";
  const lo = +m[1], hi = +m[2], help = /Graviton/.test(name);
  const ok = (last.sets || []).filter(s => typeof s.kg === "number" && typeof s.reps === "number" && s.reps > 0);
  if (!ok.length) return "";
  const inRange = ok.filter(s => s.reps >= lo);
  if (!inRange.length) {
    const ref = help ? Math.max(...ok.map(s => s.kg)) : Math.min(...ok.map(s => s.kg));
    return `<b>${num(ref)} kg</b>, buscando ${lo}–${hi} reps (se não sair ${lo}, ${help ? "aumente a ajuda" : "tire uns 10%"})`;
  }
  const ref = help ? Math.min(...inRange.map(s => s.kg)) : Math.max(...inRange.map(s => s.kg));
  const top = ok.filter(s => (help ? s.kg <= ref : s.kg >= ref) && s.reps >= hi).length >= sets;
  if (!top) return `<b>${num(ref)} kg</b>, buscando ${hi} reps em todas as séries`;
  const step = help ? 2.5 : /halter/i.test(name) ? (ref < 10 ? 1 : 2) : leg && ref >= 20 ? 5 : 2.5;
  const next = Math.max(0, help ? ref - step : ref + step);
  return `<b>${num(next)} kg</b> × ${lo}–${hi} (${help ? "menos ajuda" : "subiu"}: bateu ${hi} em todas)`;
}
function refreshCarga(){
  if (!Object.keys(pending).length) setStatus(modeText());
  refreshSend();
  const doc = LOGS[docId(person.id, logDate)];
  document.querySelectorAll(".lg").forEach(box => {
    const name = box.dataset.name, sets = doc?.ex?.[name]?.sets || [];
    const last = lastFor(person.id, name, logDate);
    const p = box.parentElement.querySelector(".last");
    if (p) p.innerHTML = last ? `Última vez (${brDate(last.date)}): <b>${fmtSets(last.sets)}</b>` : "Primeira vez: anote kg e reps de cada série.";
    const mt = box.parentElement.querySelector(".meta");
    if (mt) { const t = metaFor(last, box.dataset.reps, +box.dataset.sets, box.dataset.leg === "true", name); mt.innerHTML = t ? `Meta de hoje: ${t}` : ""; mt.hidden = !t; }
    box.querySelectorAll("input").forEach(inp => {
      const s = +inp.dataset.set, f = inp.dataset.field, lv = last?.sets?.[s]?.[f];
      const ph = lv === "" || lv == null ? (f === "kg" ? box.dataset.kg : "reps") : (f === "kg" ? num(lv) : String(lv));
      inp.placeholder = ph; inp.dataset.last = lv === "" || lv == null ? "" : String(lv);
      if (inp === document.activeElement) return;
      const v = (sets[s] || {})[f];
      inp.value = f === "kg" ? num(v) : (v ?? "");
    });
  });
}
function setStatus(text){ const el = document.getElementById("logstate"); if (el) { el.textContent = text; el.classList.toggle("local", logMode === "local"); el.classList.toggle("nostore", logMode === "local" && !storageOk); } }
// ✓ com a linha vazia: repete a carga e as reps da última vez
function autofill(btn){
  const box = btn.closest(".lg"), s = btn.dataset.s;
  const ins = [...box.querySelectorAll(`input[data-set="${s}"]`)];
  if (ins.some(x => x.value.trim() !== "") || !ins.some(x => x.dataset.last)) return;
  ins.forEach(x => { if (x.dataset.last) { x.value = x.dataset.field === "kg" ? num(x.dataset.last) : x.dataset.last; onLogInput(x); } });
}
function onLogInput(inp){
  const raw = inp.value.trim().replace(",", "."), n = Number(raw);
  writeSet(inp.dataset.name, +inp.dataset.n, +inp.dataset.set, {[inp.dataset.field]: raw === "" || isNaN(n) ? "" : n});
}
// Grava um pedaço de uma série (kg, reps ou feita) no treino da pessoa nesta data
function writeSet(name, n, s, patch){
  const id = docId(person.id, logDate);
  const doc = LOGS[id] ? JSON.parse(JSON.stringify(LOGS[id])) : {person:person.id, date:logDate, day:current, ex:{}};
  const e = doc.ex[name] || (doc.ex[name] = {sets:[]});
  while (e.sets.length < Math.max(n, s + 1)) e.sets.push({kg:"", reps:""});
  Object.assign(e.sets[s], patch);
  doc.updated = new Date().toISOString();
  LOGS[id] = doc; pending[id] = true; refreshSend(); keepDate(logDate);
  setStatus("Salvando…");
  clearTimeout(timers[id]); timers[id] = setTimeout(() => saveLog(id), 700);
}
function saveLog(id){
  chains[id] = (chains[id] || Promise.resolve()).then(async () => {
    const body = LOGS[id];
    store.set("cargas:" + id, body);   // cópia no aparelho até o banco confirmar
    if (logMode === "online" && dbRef) {
      for (let t = 0; t < 2; t++) {
        try { await dbRef.collection("treinos").doc(id).set(body); delete pending[id]; try { localStorage.removeItem(CK + id); } catch(e) {} setStatus("Salvo online ✓"); return; }
        catch(e) { if (SUPA || !(e && e.code === "unavailable") || t) break; await new Promise(r => setTimeout(r, 400 + Math.random()*600)); }
      }
      if (!SUPA) logMode = "local";
    }
    delete pending[id];
    setStatus(SUPA ? "Sem internet: salvo no celular, sobe quando voltar" : "Salvo neste celular ✓"); refreshCarga();
  });
}
// Treinos que ficaram no aparelho sobem para o banco quando ele fica disponível (o mais novo vence)
const ts = s => Date.parse(s || 0) || 0;
function syncLocal(server){
  let keys = [];
  try { for (let k = 0; k < localStorage.length; k++) { const key = localStorage.key(k); if (key && key.startsWith(CK)) keys.push(key.slice(CK.length)); } } catch(e) { return; }
  for (const id of keys) if (LOGS[id] && !(server[id] && ts(server[id].updated) >= ts(LOGS[id].updated))) saveLog(id);
}
// Versão do site (GitHub Pages): o banco é o Supabase do Rafael, sem login para ninguém
const SUPA = window.SUPA || null;
function supaDb(){
  const h = {apikey: SUPA.key, Authorization: "Bearer " + SUPA.key, "Content-Type": "application/json"};
  // coleção "treinos" → tabela de treinos do ambiente; "checkins" → tabela de check-ins do ambiente
  const ref = name => { const table = name === "checkins" ? (SUPA.checkins || "checkins") : (SUPA.table || "treinos"); const q = {
    doc: id => ({ async set(b){
      const r = await fetch(`${SUPA.url}/rest/v1/${table}?on_conflict=id`, {method: "POST", headers: {...h, Prefer: "resolution=merge-duplicates,return=minimal"},
        body: JSON.stringify({id, ...b})});
      if (!r.ok) throw {code: "unavailable"};
    }}),
    orderBy: () => q, limit: () => q,
    onSnapshot(next){
      const load = async () => { try {
        const r = await fetch(`${SUPA.url}/rest/v1/${table}?select=*&order=date.desc&limit=1000`, {headers: h});
        if (!r.ok) return;
        const rows = await r.json();
        next({docs: rows.map(({id, ...rest}) => ({id, data: () => rest})), metadata: {fromCache: false}});
      } catch(e) {} };
      load(); setInterval(load, 60000);
      addEventListener("online", load);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
    }
  }; return q; };
  return {collection: ref};
}
(async () => {
  await null;   // espera o resto do script (pessoa e dia) existir antes de desenhar
  let db = null;
  if (SUPA) db = supaDb();
  else try { db = await window.claude?.use?.("db"); } catch(e) {}
  if (!db) { logMode = "local"; refreshCarga(); return; }
  dbRef = db; logMode = "online"; refreshCarga();
  db.collection("treinos").orderBy("date", "desc").limit(500).onSnapshot(snap => {
    const server = {};
    for (const d of snap.docs) {
      const v = d.data(); server[d.id] = v;
      if (!pending[d.id] && !(LOGS[d.id] && ts(LOGS[d.id].updated) > ts(v.updated))) LOGS[d.id] = v;
    }
    if (!snap.metadata.fromCache) syncLocal(server);
    refreshCarga(); refreshToday();
  }, () => { logMode = "local"; refreshCarga(); });
  db.collection("checkins").orderBy("date", "desc").limit(500).onSnapshot(snap => {
    const server = {};
    for (const d of snap.docs) {
      const v = d.data(); server[d.id] = v;
      if (!chkPending[d.id] && !(CHK[d.id] && ts(CHK[d.id].updated) > ts(v.updated))) CHK[d.id] = v;
    }
    if (!snap.metadata.fromCache) syncChk(server);
    refreshToday();
  }, () => {});
})();

// Check-in diário (água e sono): um registro por pessoa e data na coleção "checkins"
// Metas do agente de nutrição (2026-10-09): água em copos de 250 ml (treino / descanso), sono em horas (alvo / mínimo)
const GOALS = {
  rafael: {aguaTreino: 13, aguaDescanso: 9, sono: 8, sonoMin: 7},
  laura:  {aguaTreino: 13, aguaDescanso: 9, sono: 8, sonoMin: 7},
  laysa:  {aguaTreino: 12, aguaDescanso: 8, sono: 8, sonoMin: 7},
  a3:     {aguaTreino: 12, aguaDescanso: 8, sono: 8, sonoMin: 7}
};
const CHK = {}, chkPending = {}, chkTimers = {}, chkChains = {};
const CHKK = NS + "chk:";
try { for (let k = 0; k < localStorage.length; k++) { const key = localStorage.key(k); if (key && key.startsWith(CHKK)) CHK[key.slice(CHKK.length)] = JSON.parse(localStorage.getItem(key)); } } catch(e) {}
const WD = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const parseDate = s => new Date(+s.slice(0,4), +s.slice(5,7) - 1, +s.slice(8,10));
const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dayIdFor = s => { const w = parseDate(s).getDay(); return w >= 1 && w <= 5 ? "d" + w : null; };
const goalsFor = (p, s) => { const g = GOALS[p] || GOALS.a3; return {agua: dayIdFor(s) ? g.aguaTreino : g.aguaDescanso, sono: g.sono, sonoMin: g.sonoMin}; };
const chkOf = (p, s) => CHK[docId(p, s)] || {agua: 0, sono: 0};
function weekOf(s){ const d = parseDate(s), back = (d.getDay() + 6) % 7; d.setDate(d.getDate() - back); return Array.from({length: 7}, (_, i) => { const x = new Date(d); x.setDate(d.getDate() + i); return fmtDate(x); }); }
// Séries feitas (✓ ou com carga/reps) e séries previstas do treino daquele dia
function treinoProg(p, s){
  const per = PEOPLE.find(x => x.id === p), id = dayIdFor(s), d = per?.days?.find(x => x.id === id);
  if (!d) return null;
  const doc = LOGS[docId(p, s)], total = d.ex.reduce((a, e) => a + (e[4] ? e[1] : 0), 0);
  const done = d.ex.reduce((a, e) => a + (e[4] ? Math.min(e[1], (doc?.ex?.[e[0]]?.sets || []).filter(x => x.done || filled(x)).length) : 0), 0);
  return {d, done, total};
}
// Nota do dia (0–100) para o anel do calendário: água, sono e, em dia de treino, o treino
function dayScore(p, s){
  const g = goalsFor(p, s), c = chkOf(p, s), t = treinoProg(p, s);
  const parts = [Math.min(1, (+c.agua || 0) / g.agua), Math.min(1, (+c.sono || 0) / g.sono)];
  if (t) parts.push(t.total ? t.done / t.total : 0);
  return Math.round(parts.reduce((a, b) => a + b, 0) / parts.length * 100);
}

function writeChk(field, dir){
  const id = docId(person.id, logDate);
  const c = CHK[id] ? {...CHK[id]} : {person: person.id, date: logDate, agua: 0, sono: 0};
  const v = (+c[field] || 0) + dir * (field === "agua" ? 1 : 0.5);
  c[field] = Math.max(0, Math.min(field === "agua" ? 30 : 14, v));
  c.updated = new Date().toISOString();
  CHK[id] = c; chkPending[id] = true; keepDate(logDate);
  refreshToday(); setChkStatus("Salvando…");
  clearTimeout(chkTimers[id]); chkTimers[id] = setTimeout(() => saveChk(id), 600);
}
function setChkStatus(t){ const el = document.getElementById("ckstate"); if (el) el.textContent = t; }
function saveChk(id){
  chkChains[id] = (chkChains[id] || Promise.resolve()).then(async () => {
    const body = CHK[id];
    store.set("chk:" + id, body);
    if (logMode === "online" && dbRef) {
      try { await dbRef.collection("checkins").doc(id).set(body); delete chkPending[id]; try { localStorage.removeItem(CHKK + id); } catch(e) {} setChkStatus("Salvo online ✓"); return; }
      catch(e) {}
    }
    delete chkPending[id];
    setChkStatus(SUPA ? "Sem internet: salvo no celular, sobe quando voltar" : "Salvo neste aparelho ✓");
  });
}
function syncChk(server){
  let keys = [];
  try { for (let k = 0; k < localStorage.length; k++) { const key = localStorage.key(k); if (key && key.startsWith(CHKK)) keys.push(key.slice(CHKK.length)); } } catch(e) { return; }
  for (const id of keys) if (CHK[id] && !(server[id] && ts(server[id].updated) >= ts(CHK[id].updated))) saveChk(id);
}

   <li><b>Exercícios pesados com barra/halter</b> (agachamento, stiff, supino e desenvolvimento com halteres, barra fixa, remadas): <b>nunca</b> até a falha. Todas as séries sobrando 1–2.</li>
   <li><b>Isoladores marcados "sobrar 0–1"</b> (máquina, polia ou halter, como a elevação lateral): as outras séries sobrando 1; <b>só a última</b> pode ir até a falha.</li>
   <li><b>"Até a falha" ou "drop na última"</b>: falha só na última série.</li>
   <li>É normal o mesmo peso render menos repetições nas últimas séries por causa do cansaço. Não precisa tirar peso por isso.</li>
  </ul></div>
  <div class="panel"><h3>Alguém te ajudou a subir?</h3><ul>
   <li>Repetição com ajuda <b>não conta</b>. Anote só as que você fez sozinho.</li>
   <li>Ajuda na última repetição da última série, de vez em quando: o peso está certo, você só foi além da falha. Mantenha.</li>
   <li>Precisou de ajuda já na 1ª ou 2ª série, ou em várias repetições: o peso está alto. <b>Tire 5–10%</b>.</li>
   <li>Ter alguém do lado por segurança no supino e no agachamento é ótimo, desde que a pessoa só encoste na barra se você travar.</li>
  </ul></div>
  <div class="panel"><h3>Drop na última</h3><p>Na última série, quando chegar ao fim das repetições, tire uns 20–30% do peso na hora e continue até quase não conseguir mais. Só nos exercícios marcados.</p></div>
  <div class="panel"><h3>1ª semana da ficha</h3><p>Semana de teste em todos os exercícios: escolha a carga que deixa sobrar 3 no topo da faixa de repetições, <b>sem drop e sem isometria</b>, e anote as cargas. Nos exercícios que você já fazia, parta da carga que já usava. Da 2ª semana em diante, "sobrar" e drops como está na ficha.</p></div>
  <div class="panel"><h3>Progressão dupla</h3><p>Bateu o topo da faixa de reps em todas as séries sobrando o que a ficha pede? Sobe a carga: <b>+1–2,5 kg</b> nos exercícios de cima, <b>+2,5–5 kg</b> nos de perna, e volta para o fundo da faixa. Se o menor salto for grande demais (halter, polia), primeiro faça o topo +2 reps em 2 sessões, depois suba. No graviton, tire 2,5–5 kg de assistência.</p></div>
  <div class="panel"><h3>Execução</h3><ul>
   <li>Aquecimento: 5 min leve + 50% × 8, 70% × 4, 85% × 1–2 no primeiro exercício de cada grupo.</li>
   <li>Descida controlada em ~2 s, sem quicar; priorize a posição alongada.</li>
   <li>Drop-set só onde está marcado: última série dos isolados.</li>
   <li>Descanso: 2–3 min nos compostos, 1–2 min nos isolados.</li>
   <li>Respiração: solte o ar na fase de esforço. Prender o ar só por uma rep nas séries bem pesadas.</li>
   <li>Sábado e domingo são descanso. Se perder um dia, siga a ordem: o próximo treino é o que vem na lista.</li>
  </ul></div>
  <div class="panel"><h3>Deload: semana 7 (todos juntos)</h3><p>Mesmos exercícios e mesmas cargas, <b>40–50% menos séries</b>, sobrando 3. Antecipe se 2 ou mais sinais aparecerem juntos por 2–3 sessões: "sobrar" caindo com a mesma carga, reps caindo nos exercícios principais, disposição baixa ou faltas, sono abaixo de 5 h em 3+ noites.</p></div>
  <div class="panel"><h3 class="warn">Pare na hora</h3><p>Dor aguda ou em pontada na articulação, dor que irradia, dormência, perda de força, dor no peito, falta de ar fora do normal, tontura. Procure médico ou fisioterapeuta.</p></div>
 </section>`,
 breno:`<section class="list" style="--pc:var(--p10)">
  <div class="dayhead"><div><div class="eyebrow">46 vídeos de execução lidos · out/2026</div><h2>O que o Breno ensina</h2></div></div>
  <div class="panel"><p>A linha dele é baseada em evidência e bate com a sua ficha: nenhuma pegada ou posição do pé "isola" parte do músculo; o que importa é execução controlada, amplitude, progressão de carga e consistência. As dicas dele estão dentro de cada exercício, marcadas com <span class="breno">Breno</span> e o link do vídeo.</p></div>
  <div class="panel"><h3>O que eu peguei dele para a sua ficha</h3><div class="tbl"><table>
   <thead><tr><th>Mudança</th><th>Por quê</th><th>Vídeo</th></tr></thead>
   <tbody>
    <tr><td>Os mesmos 5 treinos da divisão dele (Empurrar, Puxar, Pernas, Superiores, Pernas), na ordem que você escolheu: Seg Empurrar · Ter Pernas · Qua Puxar · Qui Pernas · Sex Superiores</td><td>Alterna dia de cima e dia de perna; cada músculo 2x por semana sem repetir em dias seguidos</td><td><a href="${IG("DdJjEH_xSlK")}" target="_blank" rel="noopener">5x/semana</a></td></tr>
    <tr><td>Supino inclinado a ~30°</td><td>Mais inclinado vira treino de deltoide anterior</td><td><a href="${IG("DdjKhL9hBLJ")}" target="_blank" rel="noopener">inclinado</a></td></tr>
    <tr><td>Desenvolvimento com encosto a 75–80°</td><td>Mais estável e cotovelo no plano da escápula</td><td><a href="${IG("Dc9LwoEhC15")}" target="_blank" rel="noopener">desenvolvimento</a></td></tr>
    <tr><td>Voador invertido no Pull</td><td>Ombro "3D" precisa do posterior</td><td><a href="${IG("DeB52oIhQ_d")}" target="_blank" rel="noopener">posterior</a></td></tr>
    <tr><td>Respirar soltando o ar no esforço</td><td>Prender o ar em toda rep pode dar tontura</td><td><a href="${IG("DeKH-_6RGBi")}" target="_blank" rel="noopener">respiração</a></td></tr>
   </tbody></table></div></div>
  <div class="panel"><h3>Ideias dele que se repetem</h3><ul>
   <li>Não existe execução perfeita e universal: ajuste à sua estrutura e ao conforto da articulação.</li>
   <li>Carga não é ego: se a amplitude encurta ou o corpo balança, o peso venceu você.</li>
   <li>Falha é ferramenta, não obrigação: 1–2 repetições na reserva na maioria das séries. <a href="${IG("DdSJwqqPQgu")}" target="_blank" rel="noopener">vídeo</a></li>
   <li>Tríceps é cerca de 2/3 do braço: para "manga apertada", não esqueça dele. <a href="${IG("DeKwBLcPNF3")}" target="_blank" rel="noopener">vídeo</a></li>
  </ul></div>
  <div class="panel"><p><b>Onde eu divirjo:</b> ele coloca elevação frontal em quase todo treino de ombro. Para você, o deltoide da frente já recebe volume dos supinos e do desenvolvimento, então esse tempo vai para o ombro lateral e posterior, que dão largura.</p></div>
 </section>`
};

const PANELS_LAURA = PANELS, PANELS_LAYSA = PANELS;
// Pessoas que treinam juntas. Cada uma tem a própria ficha.
const PEOPLE = [
 {id:"rafael", name:"Rafael", art:"do", days:DAYS, panels:PANELS,
  eyebrow:"Bloco 1 · Base Cavill · 6 semanas desde 08/10/2026",
  },
 {id:"laura", name:"Laura", art:"da", days:DAYS_LAURA, panels:PANELS_LAURA,
  eyebrow:"Bloco 1 · Recomposição · 6 semanas desde 08/10/2026",
  },
 {id:"laysa", name:"Laysa", art:"da", days:DAYS_LAYSA, panels:PANELS_LAYSA,
  eyebrow:"Bloco 1 · Volta aos treinos · 6 semanas desde 08/10/2026",
  },
 {id:"a3", name:"Amiga 3", art:"da", days:null}
];

const who = document.getElementById("who"), head = document.getElementById("head");
const tabs = document.getElementById("tabs"), view = document.getElementById("view");
const dock = document.getElementById("dock"), timerEl = document.getElementById("timer");
let person = PEOPLE.find(p=>p.id===store.get("person")) || PEOPLE[0];
let current = dayIdFor(logDate) || store.get("tab:"+person.id) || "d1";
let screen = store.get("screen") || "hoje";   // hoje | treino | mais | um painel de EXTRA
const markKey = dayId => "marks4:"+person.id+":"+dayId+":"+logDate;
const MARKS = {};
const getMarks = k => MARKS[k] || (MARKS[k] = store.get(k) || {});

const PENDING = p => `<section class="list pending" style="--pc:var(--p5)">
  <div class="dayhead"><div><div class="eyebrow">Ficha em construção</div><h2>Falta a avaliação ${p.art} ${p.name}</h2></div></div>
  <div class="panel"><p>Cada pessoa precisa de uma ficha própria: objetivo, experiência, cargas e histórico de lesão mudam o volume, os exercícios e a progressão. Mande para o personal (Claude, no chat):</p><ul>
   <li>Nome, idade, peso e altura</li>
   <li>Objetivo principal (ex.: glúteo e pernas, emagrecer, ganhar massa, definir)</li>
   <li>Há quanto tempo treina e cargas que usa hoje</li>
   <li>Lesões, dores, cirurgias, gravidez ou condição médica</li>
   <li>Se treina junto com você de segunda a sexta ou em outros dias</li>
   <li>Medidas, se tiver: cintura, quadril, coxa, braço</li>
  </ul></div>
  <div class="panel"><p>Enquanto isso, as abas <b>Regras</b> e <b>Breno</b> do Rafael valem para todo mundo: sobrar 1–2 repetições, progressão de carga e execução controlada.</p></div>
 </section>`;

function drawWho(){
  who.innerHTML = PEOPLE.map(p=>`<button type="button" data-person="${p.id}" aria-pressed="${p.id===person.id}">${p.name}</button>`).join("");
}
function drawHead(){
  head.innerHTML = `<div class="eyebrow">${person.eyebrow || "Aguardando avaliação"}</div><h1>Olá, ${person.name}!</h1>`;
}
function drawTabs(){
  if (screen !== "treino" || !person.days){ tabs.hidden = true; tabs.innerHTML = ""; return; }
  tabs.hidden = false;
  tabs.innerHTML = person.days.map(t => `<button type="button" role="tab" data-tab="${t.id}" aria-selected="${t.id===current}" style="--pc:var(${t.plate})"><span class="wd"><span class="plate"></span>${t.wd}</span><span class="nm">${t.name}</span></button>`).join("");
}
function drawDock(){
  const sec = ["hoje","treino","mais"].includes(screen) ? screen : "mais";
  dock.querySelectorAll("[data-screen]").forEach(b => b.dataset.screen === sec ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  timerEl.hidden = screen !== "treino";
  document.body.classList.toggle("has-timer", screen === "treino");
}
function renderMais(){
  const desc = {dieta:"Calorias, proteína e suplementos", regras:"Sobrar, falha, drop, progressão e deload", medidas:"Peso, medidas e próxima avaliação", breno:"O que veio dos vídeos do Breno Aceti"};
  return `<section class="list"><h2>Mais</h2><div class="menu">${EXTRA.map(t => `<button type="button" data-screen="${t.id}"><span>${t.name}<small>${desc[t.id] || ""}</small></span><span aria-hidden="true">›</span></button>`).join("")}</div></section>`;
}
function draw(){
  drawWho(); drawHead(); drawTabs(); drawDock();
  if (screen === "hoje") { view.innerHTML = renderToday(); refreshToday(); return; }
  if (screen === "mais") { view.innerHTML = renderMais(); return; }
  if (EXTRA.find(t => t.id === screen)) { view.innerHTML = `<button type="button" class="ghost back" data-screen="mais">‹ Mais</button>` + (person.panels || PANELS)[screen]; return; }
  if (!person.days){ view.innerHTML = PENDING(person); return; }
  if (!person.days.find(t=>t.id===current)) current = "d1";
  view.innerHTML = renderDay(person.days.find(x=>x.id===current));
  refreshCarga();
}
const goScreen = s => { screen = s; store.set("screen", s); draw(); window.scrollTo({top:0}); };
dock.addEventListener("click", e => { const b = e.target.closest("[data-screen]"); if (b) goScreen(b.dataset.screen); });
view.addEventListener("input", e => { if (e.target.closest(".lg")) onLogInput(e.target); });
view.addEventListener("change", e => { if (e.target.id === "logdate" && e.target.value) { logDate = e.target.value; keepDate(logDate); current = dayIdFor(logDate) || current; draw(); } });
who.addEventListener("click", e=>{
  const btn = e.target.closest("[data-person]"); if(!btn) return;
  person = PEOPLE.find(p=>p.id===btn.dataset.person); store.set("person", person.id);
  current = dayIdFor(logDate) || store.get("tab:"+person.id) || "d1"; draw();
});
tabs.addEventListener("click", e=>{
  const btn = e.target.closest("[data-tab]"); if(!btn) return;
  current = btn.dataset.tab; store.set("tab:"+person.id, current); draw();
  window.scrollTo({top:0});
});
view.addEventListener("click", e=>{
  const nav = e.target.closest("[data-screen]");
  if (nav){ goScreen(nav.dataset.screen); return; }
  const dayBtn = e.target.closest("[data-date]");
  if (dayBtn){ logDate = dayBtn.dataset.date; keepDate(logDate); current = dayIdFor(logDate) || current; draw(); return; }
  const ck = e.target.closest("[data-ck]");
  if (ck){ writeChk(ck.dataset.ck, +ck.dataset.d); return; }
  const add = e.target.closest(".addset");
  if (add){
    addRows[add.dataset.k] = +add.dataset.total - +add.dataset.sets + 1;
    const y = scrollY; draw(); scrollTo(0, y);
    document.getElementById(`kg-${current}-${add.dataset.ex}-${add.dataset.total}`)?.focus();
    return;
  }
  const wa = e.target.closest("#sendwa"), cp = e.target.closest("#copytxt");
  if (wa || cp){
    const t = treinoText(), sum = document.getElementById("sendsum");
    if (!t){ e.preventDefault(); sum.textContent = "Nada anotado ainda: preencha kg e reps ou marque ✓ em alguma série."; return; }
    if (wa){ wa.href = "https://wa.me/?text=" + encodeURIComponent(t); return; }
    const box = document.getElementById("sendtxt"), showBox = () => { box.hidden = false; box.value = t; box.focus(); box.select(); sum.textContent = "Selecionei o texto: toque e segure para copiar."; };
    try { navigator.clipboard.writeText(t).then(() => { sum.textContent = "Copiado. Cole no WhatsApp ou no chat."; }, showBox); } catch(err){ showBox(); }
    return;
  }
  const set = e.target.closest(".set");
  if (set){
    const k = markKey(current), m = getMarks(k), key = set.dataset.ex+"-"+set.dataset.s;
    m[key] = set.getAttribute("aria-pressed") !== "true"; store.set(k, m);
    const d = person.days.find(x=>x.id===current), i = +set.dataset.ex, [, n, , , rest] = d.ex[i];
    set.setAttribute("aria-pressed", String(m[key]));
    set.closest(".lg")?.querySelectorAll(`input[data-set="${set.dataset.s}"]`).forEach(x => x.classList.toggle("ok", m[key]));
    set.closest(".ex").classList.toggle("done", Array.from({length:n}).every((_, s) => m[i+"-"+s]));
    if (m[key] && set.closest(".lg")) autofill(set);
    if (set.closest(".lg")) writeSet(d.ex[i][0], n, +set.dataset.s, {done: m[key]});
    if (m[key] && rest) startTimer(rest);
    return;
  }
  if (e.target.id==="reset"){ const k = markKey(current); MARKS[k] = {}; store.set(k, {}); draw(); }
});

// Timer
const clock = document.getElementById("clock"), fill = document.getElementById("barfill");
let endAt = 0, total = 0, tick = null, actx = null;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(t=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.2, actx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+t+0.2);
      o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.2);
    });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
function startTimer(sec){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume && actx.resume(); }catch(e){}
  total = sec; endAt = Date.now() + sec*1000; clock.classList.remove("zero");
  clearInterval(tick); update(); tick = setInterval(update, 250);
}
function update(){
  const left = Math.max(0, Math.ceil((endAt - Date.now())/1000));
  clock.textContent = fmt(left);
  fill.style.width = total ? ((total-left)/total*100)+"%" : "0";
  if (left===0 && tick){ clearInterval(tick); tick=null; clock.classList.add("zero"); clock.textContent="Vai!"; beep(); }
}
document.querySelectorAll(".timer [data-t]").forEach(bt=>bt.addEventListener("click",()=>startTimer(+bt.dataset.t)));
document.getElementById("stop").addEventListener("click",()=>{ clearInterval(tick); tick=null; total=0; clock.textContent="0:00"; clock.classList.remove("zero"); fill.style.width="0"; });

draw();
</script>

</body></html>

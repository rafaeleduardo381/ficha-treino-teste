<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14181D"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>TESTE · Ficha do Rafael · Bloco 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de academia para o celular, escuro. Tela "Hoje" (semana + check-in de água e sono + treino do dia),
   tela "Treino" (ficha do dia com séries) e "Mais"; menu flutuante embaixo, timer flutuante só no treino.
   Cores dos dias = anilhas (25 vermelha, 20 azul, 15 amarela, 10 verde, 5 roxa). */
:root{
  --bg:#0D0E10; --surface:#17181B; --surface2:#222428; --ink:#F3F4EF; --soft:#D5D7D0; --muted:#8E929A; --line:#2A2D32;
  --lime:#C6F24E; --lime-ink:#151708; --violet:#A68BFF; --coral:#FF6A4D; --blue:#4DB2FF; --sono:#F4C542;
  --accent:var(--lime); --accent-ink:var(--lime-ink);
  --p25:#FF6A4D; --p20:#6E9BFF; --p15:#F4C542; --p10:#C6F24E; --p5:#A68BFF;
  --ok:#C6F24E; --warn:#FFB547;
  --f-display:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:22px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 120px;display:flex;flex-direction:column;gap:20px}
body.has-timer .wrap{padding-bottom:190px}
.wrap{overflow-x:clip}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:800;line-height:1.1}
h2{font-size:1.35rem;font-weight:800;line-height:1.2}
h3{font-size:1.05rem;font-weight:700}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--lime);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* Topo: saudação e pessoa */
.top{display:flex;flex-direction:column;gap:14px}
.hello{display:flex;flex-direction:column;gap:4px}
.who{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.who::-webkit-scrollbar{display:none}
.who button{flex:none;font:inherit;font-weight:700;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 9px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.wday span{font-size:.72rem;color:var(--muted);font-weight:700}
.wday b{font-size:1.1rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.wday.today:not(.on){border-color:var(--muted)}
.wday.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.wday.on span{color:var(--lime-ink)}
.dot{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--lime) calc(var(--p,0)*1%),var(--surface2) 0);position:relative}
.dot::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.wday.on .dot{background:conic-gradient(var(--lime-ink) calc(var(--p,0)*1%),color-mix(in srgb,var(--lime-ink) 22%,transparent) 0)}
.wday.on .dot::after{background:var(--lime)}

/* Check-in */
.sec{display:flex;align-items:center;gap:10px;font-size:1.25rem}
.count{font-size:.75rem;font-weight:800;color:var(--muted);background:var(--surface2);border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ck{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.ck-h{align-self:stretch;display:flex;align-items:center;gap:10px;font-weight:800}
.ico{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--c)}
.ico svg{width:18px;height:18px}
.ring{position:relative;width:min(132px,100%);aspect-ratio:1}
.ring svg{width:100%;height:100%;display:block}
.ring .track{stroke:color-mix(in srgb,var(--c) 30%,transparent)}
.dot-p{fill:var(--c);opacity:.13;transform-box:fill-box;transform-origin:center;transform:scale(.7)}
.dot-p.on{opacity:1;transform:scale(1)}
.pr-ring .dm{fill:var(--c);opacity:.15}
.pr-ring .dm.on{opacity:1}
.ring .lbl small{font-variant-numeric:tabular-nums}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lbl b{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.ring .lbl small{font-size:.75rem;color:var(--muted);white-space:nowrap}
.step{display:flex;align-items:center;background:var(--surface2);border-radius:14px;overflow:hidden}
.step button{width:54px;height:46px;border:0;background:none;color:var(--ink);font-size:1.5rem;line-height:1;cursor:pointer}
.step button+button{border-left:1px solid var(--line);color:var(--lime)}
.ck{position:relative}
.badge{display:none;margin-left:auto;font:inherit;font-size:.7rem;font-weight:800;color:var(--bg);background:var(--c);border:0;border-radius:999px;padding:3px 9px;white-space:nowrap;cursor:pointer}
.cheer{position:absolute;inset:11%;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;font-weight:800;font-size:1.05rem;line-height:1.15;color:var(--c);opacity:0;z-index:1;pointer-events:none;padding:8px}
@keyframes ck-cheer{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.06)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes ck-cheer-calmo{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
.ck.win .cheer{animation:ck-cheer-calmo 1.8s ease forwards}
.ck.win{box-shadow:0 0 0 2px var(--c)}
.ck.met .badge{display:inline-block}
.ck.met .ring .lbl b{color:var(--c)}
.bit{position:absolute;left:50%;top:44%;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:2}
@keyframes ck-pop{0%{transform:scale(1)}35%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes ck-glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 55%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
@media (prefers-reduced-motion:no-preference){.ck.win{animation:ck-glow .9s ease-out}.ck.win .ring{animation:ck-pop .6s cubic-bezier(.3,1.6,.5,1)}.ck.win .cheer{animation:ck-cheer 1.8s cubic-bezier(.3,1.4,.5,1) forwards}}
.ck-note{font-size:.75rem;color:var(--muted);text-align:center;margin:0;text-wrap:balance}
.ckstate{font-size:.8rem;color:var(--muted);margin:0}
.todaycard{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--ink);font:inherit;cursor:pointer}
.todaycard .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.todaycard p{margin:0;color:var(--muted);font-size:.9rem}
.pbar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pc,var(--lime));border-radius:99px}
.go{width:42px;height:42px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;flex:none}
.go svg{width:20px;height:20px}

/* Menu flutuante */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:6px;align-items:center;background:color-mix(in srgb,var(--surface2) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.dock button{display:flex;align-items:center;gap:8px;height:52px;min-width:56px;justify-content:center;padding:0 16px;border:0;border-radius:999px;background:none;color:var(--muted);font:inherit;font-weight:800;font-size:.95rem;cursor:pointer}
.dock button svg{width:22px;height:22px;flex:none}
.dock button span{display:none}
.dock button[aria-current="page"]{background:var(--lime);color:var(--lime-ink);padding:0 22px}
.dock button[aria-current="page"] span{display:inline}

/* Mais */
.menu{display:flex;flex-direction:column;gap:10px}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);color:var(--ink);font:inherit;font-weight:800;font-size:1.05rem;text-align:left;cursor:pointer}
.menu small{display:block;font-weight:500;color:var(--muted);font-size:.85rem}
.back{align-self:flex-start}

/* Dias do treino */
nav.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
nav.days button{min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
nav.days .wd{font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:5px}
nav.days .nm{font-size:.66rem;font-weight:600;color:var(--muted);white-space:nowrap}
nav.days .plate{width:8px;height:8px;border-radius:50%;background:var(--pc);flex:none}
nav.days button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.days button[aria-selected="true"] .nm{color:var(--bg)}

/* Ficha do dia */
.list{display:flex;flex-direction:column;gap:12px}
.pending{display:flex;flex-direction:column;gap:12px}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dayhead .eyebrow{color:var(--pc,var(--muted))}
.dayhead p{margin:0;color:var(--muted)}
.ghost{font:inherit;font-size:.85rem;font-weight:700;background:var(--surface2);border:0;color:var(--soft);border-radius:10px;padding:8px 12px;cursor:pointer}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ex.done{border-color:color-mix(in srgb,var(--lime) 55%,var(--line))}
.ex-top{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start}
.ex-n{font-family:var(--f-mono);font-weight:600;color:var(--pc);font-size:1rem;line-height:1.7}
.ex-name{font-size:1.1rem;font-weight:800;min-width:0;line-height:1.35}
.presc{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8rem;font-weight:700;background:var(--surface2);color:var(--soft);border-radius:8px;padding:3px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.drop{background:var(--coral);color:#1A0B06}
.last{margin:0;font-size:.85rem;color:var(--muted)}
.last b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.meta{margin:0;font-size:.9rem;color:var(--soft)}
.meta b{font-weight:800;color:var(--lime)}
.lg{display:grid;grid-template-columns:2rem minmax(0,1fr) minmax(0,1fr) 3.2rem;gap:8px;align-items:center}
.lg .h{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.lg .h:first-child{text-align:left}
.lg .sn{font-family:var(--f-mono);font-weight:600;color:var(--pc);font-size:1.05rem}
.lg .sn.extra{color:var(--muted)}
.lg input{width:100%;min-width:0;height:48px;font:inherit;font-size:1.1rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 6px;text-align:center}
.lg input::placeholder{color:var(--muted);opacity:.6;font-weight:600}
.lg input:focus{border-color:var(--lime);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--lime) 30%,transparent)}
.lg input.ok{background:color-mix(in srgb,var(--lime) 10%,var(--surface));border-color:color-mix(in srgb,var(--lime) 40%,var(--line))}
.set{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--bg);font:inherit;font-weight:800;cursor:pointer;color:var(--muted);user-select:none}
.lg .set{width:100%;border-radius:12px;font-size:1.2rem}
.set[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.sets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addset{align-self:flex-start}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";font-family:var(--f-mono)}
details[open] summary::before{content:"− "}
details ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.92rem;color:var(--soft)}
.breno{display:inline-block;font-weight:800;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--lime);color:var(--lime);border-radius:6px;padding:0 5px;margin-right:5px}
.alerta{display:inline-block;font-weight:800;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--warn);color:var(--warn);border-radius:6px;padding:0 5px;margin-right:5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel p,.panel ul{margin:0}
.panel ul{padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--soft)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.ok{color:var(--lime);font-weight:700}.warn{color:var(--warn);font-weight:700}
.logbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.logbar input{font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
#logstate{font-size:.8rem;color:var(--lime)}
#logstate.local{color:var(--muted)}
#logstate.nostore{color:var(--warn);font-weight:700}
.sendbox h3{margin:0}
.sendsum{color:var(--muted)}
.sendrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-wa{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:14px;background:var(--lime);color:var(--lime-ink);font-weight:800;text-decoration:none;flex:1 1 200px}
.sendrow .ghost{min-height:48px;padding:0 16px}
.sendtxt{width:100%;min-height:8rem;font-family:var(--f-mono);font-size:.85rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px}

/* Timer de descanso (só na tela de treino) */
.timer{position:fixed;left:50%;transform:translateX(-50%);width:min(536px,calc(100% - 24px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 10px 10px;box-shadow:0 8px 24px rgba(0,0,0,.45);overflow:hidden}
.timer-in{display:flex;align-items:center;gap:6px}
.timer .lbl{display:none}
.clock{font-family:var(--f-mono);font-size:1.5rem;font-weight:600;min-width:4.4ch;font-variant-numeric:tabular-nums}
.clock.zero{color:var(--lime)}
.timer button{flex:1 1 0;min-width:0;font:inherit;font-weight:700;font-size:.85rem;background:var(--surface2);color:var(--ink);border:0;border-radius:10px;padding:9px 2px;cursor:pointer}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px}
.bar i{display:block;height:100%;width:0;background:var(--lime)}
footer{color:var(--muted);font-size:.78rem;text-align:center}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .9s linear}.dot-p{transition:opacity .28s ease,transform .28s cubic-bezier(.3,1.6,.5,1)}.pr-ring .dm.on{animation:dot-in .35s ease both}}
@keyframes dot-in{from{opacity:.15}to{opacity:1}}
@media (max-width:380px){.cards{gap:8px}.ck{padding:14px 10px}.step button{width:44px}}

/* Ofensiva */
.streak{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.streak::before{content:"";position:absolute;left:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--fa) 35%,transparent),transparent 70%);pointer-events:none}
.fl{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface2);border-radius:18px;padding:10px 12px 8px;min-width:96px}
.flame-ico{width:44px;height:52px;filter:drop-shadow(0 4px 12px color-mix(in srgb,var(--fa) 60%,transparent))}
.fl b{font-size:1.6rem;font-weight:800;line-height:1}
.fl span{font-size:.7rem;color:var(--muted);text-align:center;line-height:1.2}
.st-r{display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.st-t{margin:0;font-weight:700;font-size:.92rem}
.st-week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.sd{display:flex;flex-direction:column;align-items:center;gap:3px}
.sd i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.8rem;background:var(--surface2);color:var(--muted)}
.sd.done i{background:linear-gradient(160deg,var(--fb),var(--fa));color:#1A0D05}
.sd.today i{box-shadow:inset 0 0 0 2px var(--fa)}
.sd.miss i{color:var(--coral)}
.sd em{font-style:normal;font-size:.66rem;color:var(--muted);font-weight:700}
.st-best{margin:0;font-size:.75rem;color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:30;display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 24px);font-size:.9rem;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.toast .flame-ico{width:28px;height:34px;flex:none}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* Check-in extra */
.ckx h3{font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.85rem;font-weight:700;color:var(--soft);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.togs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tog{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font:inherit;text-align:left;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font-weight:700;font-size:.88rem}
.tog small{font-weight:500;color:var(--muted);font-size:.75rem}
.tog[aria-pressed="true"]{background:color-mix(in srgb,var(--lime) 14%,var(--surface2));border-color:var(--lime)}
.tog[aria-pressed="true"] span::before{content:"✓ ";color:var(--lime)}
.pesorow{display:flex;align-items:center;gap:10px}

const ringState = {}, ringRaf = {};
function animateRing(k, frac, v = 0, goal = 1){
  const svg = document.getElementById("ring-" + k), b = document.getElementById("ck-" + k); if (!svg || !b) return;
  const dots = svg.querySelectorAll(".dot-p"), f = Math.max(0, frac || 0), to = Math.round(Math.min(1, f) * DOTS), pctTo = Math.round(f * 100);
  const from = ringState[k]?.lit ?? 0, vFrom = ringState[k]?.v ?? 0;
  ringState[k] = {lit: to, pct: pctTo, v};
  const calmo = matchMedia("(prefers-reduced-motion: reduce)").matches;
  dots.forEach((d, i) => {
    const on = i < to, muda = on !== d.classList.contains("on");
    const ordem = to > from ? i - from : from - 1 - i;
    d.style.transitionDelay = calmo || !muda ? "0ms" : Math.max(0, ordem) * 22 + "ms";
    d.classList.toggle("on", on);
  });
  // o número sobe (ou desce) até o valor novo
  const txt = x => k === "agua" ? ml(Math.round(x / 10) * 10) : `${num(Math.round(x * 10) / 10)}/${num(goal)}`;
  cancelAnimationFrame(ringRaf[k]); clearTimeout(ringRaf[k + "t"]);
  if (calmo || vFrom === v) { b.textContent = txt(v); return; }
  const t0 = performance.now(), dur = Math.min(1000, 200 + Math.abs(to - from) * 22);
  const tick = t => { const x = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - x, 3); b.textContent = txt(vFrom + (v - vFrom) * e); if (x < 1) ringRaf[k] = requestAnimationFrame(tick); };
  ringRaf[k] = requestAnimationFrame(tick);
  ringRaf[k + "t"] = setTimeout(() => { cancelAnimationFrame(ringRaf[k]); b.textContent = txt(v); }, dur + 80);   // garante o número final mesmo se a animação parar
}

function writeChk(field, dir){
  const id = docId(person.id, logDate);

  if (before < goal && c[field] >= goal) requestAnimationFrame(() => celebrate(field));

function celebrate(field){
  const card = document.getElementById("card-" + field); if (!card) return;
  try { navigator.vibrate && navigator.vibrate([30, 40, 30]); } catch(e) {}
  card.classList.remove("win"); void card.offsetWidth; card.classList.add("win");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { setTimeout(() => card.classList.remove("win"), 1800); return; }
  setTimeout(() => card.classList.remove("win"), 1800);
  const colors = field === "agua" ? ["var(--blue)", "#BFE3FF", "var(--ink)"] : ["var(--sono)", "#FFEBA8", "var(--ink)"];
  for (let i = 0; i < 22; i++) {
    const bit = document.createElement("i");
    bit.className = "bit";
    bit.style.background = colors[i % colors.length];
    if (i % 3 === 0) bit.style.borderRadius = "50%";
    card.appendChild(bit);
    const a = Math.PI * 2 * i / 22 + Math.random() * .5, d = 60 + Math.random() * 70;
    bit.animate([
      {transform: "translate(-50%,-50%) rotate(0deg) scale(1)", opacity: 1},
      {transform: `translate(calc(-50% + ${Math.cos(a) * d * .8}px), calc(-50% + ${Math.sin(a) * d * .8}px)) rotate(${Math.random() * 360 - 180}deg) scale(1)`, opacity: 1, offset: .6},
      {transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d + 30}px)) rotate(${Math.random() * 540 - 270}deg) scale(.7)`, opacity: 0}
    ], {duration: 1300 + Math.random() * 600, easing: "cubic-bezier(.2,.7,.3,1)"}).onfinish = () => bit.remove();

}

// ───────────── Ofensiva: dias úteis seguidos com treino (sábado e domingo não contam nem quebram) ─────────────
function trained(p, s){
  const doc = LOGS[docId(p, s)];
  return !!doc && Object.values(doc.ex || {}).some(e => (e.sets || []).some(x => x.done || filled(x)));
}
const isWeekday = s => { const w = parseDate(s).getDay(); return w >= 1 && w <= 5; };
function streakOf(p){
  const today = trainDay(), d = parseDate(today); let n = 0;
  for (let i = 0; i < 600; i++) {
    const s = fmtDate(d);
    if (isWeekday(s)) { if (trained(p, s)) n++; else if (s !== today) break; }   // hoje ainda dá tempo de treinar
    d.setDate(d.getDate() - 1);
  }
  return n;
}
function bestStreak(p){
  const dates = Object.values(LOGS).filter(x => x && x.person === p).map(x => x.date).sort();
  if (!dates.length) return 0;
  const today = trainDay(), d = parseDate(dates[0]), end = parseDate(today); let run = 0, best = 0;
  while (d <= end) { const s = fmtDate(d); if (isWeekday(s)) { if (trained(p, s)) best = Math.max(best, ++run); else if (s !== today) run = 0; } d.setDate(d.getDate() + 1); }
  return best;
}

// ───────────── Cálculos para o Progresso ─────────────
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); };
const lastDays = (n, end = trainDay()) => Array.from({length: n}, (_, i) => addDays(end, i - n + 1));
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
function pesoAt(p, s){ const v = CHK[docId(p, s)]?.peso; return v ? +v : null; }
function pesoTrend(p, end){
  const w = lastDays(7, end).map(s => pesoAt(p, s)).filter(v => v), prev = lastDays(7, addDays(end, -7)).map(s => pesoAt(p, s)).filter(v => v);
  if (!w.length) return null;
  return {avg: avg(w), delta: prev.length ? avg(w) - avg(prev) : null};
}
function lastPeso(p, s){ let best = null; for (const c of Object.values(CHK)) if (c && c.person === p && c.peso && c.date <= s && (!best || c.date > best.date)) best = c; return best ? +best.peso : null; }
const restOf = (p, name) => { for (const d of PEOPLE.find(x => x.id === p)?.days || []) for (const e of d.ex) if (e[0] === name) return e[4]; return 90; };
function sessionStats(p, doc){
  let vol = 0, sets = 0, sec = 0;
  for (const [name, e] of Object.entries(doc.ex || {})) {
    const done = (e.sets || []).filter(x => x.done || filled(x));
    sets += done.length; sec += done.length * (40 + restOf(p, name));
    if (!/Graviton/.test(name)) for (const x of done) if (typeof x.kg === "number" && typeof x.reps === "number") vol += x.kg * x.reps;
  }
  const kg = lastPeso(p, doc.date);
  return {vol, sets, min: Math.round(sec / 60), kcal: kg ? Math.round(2.5 * kg * sec / 3600) : null};   // MET 3,5 − 1 de repouso
}
const sessionsOf = (p, from) => Object.values(LOGS).filter(d => d && d.person === p && d.date >= from && trained(p, d.date)).sort((a, b) => a.date < b.date ? -1 : 1);
function evolucao(p, from){
  const hist = {};
  for (const d of sessionsOf(p, from)) for (const [name, e] of Object.entries(d.ex || {})) {
    if (/Graviton|Caminhada/.test(name)) continue;
    const best = Math.max(0, ...(e.sets || []).filter(x => typeof x.kg === "number" && typeof x.reps === "number" && x.reps > 0).map(x => x.kg * (1 + x.reps / 30)));
    if (best) (hist[name] ||= []).push({date: d.date, e1: best});
  }
  return Object.entries(hist).filter(([, h]) => h.length >= 2).map(([name, h]) => ({name, first: h[0].e1, last: h[h.length - 1].e1, pct: (h[h.length - 1].e1 / h[0].e1 - 1) * 100})).sort((a, b) => b.pct - a.pct);
}

  head.innerHTML = `<h1>Olá, ${person.name}!</h1>`;
}
function drawTabs(){
  tabs.hidden = true; tabs.innerHTML = ""; return;   // os dias agora ficam na visão da semana
  tabs.hidden = false;
  tabs.innerHTML = person.days.map(t => `<button type="button" role="tab" data-tab="${t.id}" aria-selected="${t.id===current}" style="--pc:var(${t.plate})"><span class="wd"><span class="plate"></span>${t.wd}</span><span class="nm">${t.name}</span></button>`).join("");
}
function drawDock(){
  const sec = ["hoje","treino","progresso"].includes(screen) ? screen : "";
  dock.querySelectorAll("[data-screen]").forEach(b => b.dataset.screen === sec ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  document.body.dataset.tela = screen;
  const tm = screen === "treino" && treinoView === "dia";
  timerEl.hidden = !tm;
  document.body.classList.toggle("has-timer", tm);
}
const BLOCO = {start: "2026-10-08", weeks: 6};
const GUIA_DESC = {dieta: "Calorias, proteína e suplementos", regras: "Sobrar, falha, drop, progressão e deload", medidas: "Peso, medidas e próxima avaliação", breno: "O que veio dos vídeos do Breno Aceti"};
const dm = s => s.slice(8, 10) + "/" + s.slice(5, 7);
const kg1 = v => num((Math.round(v * 10) / 10).toFixed(1));
function blocoInfo(){
  const w0 = weekOf(BLOCO.start)[0], n = Math.round((parseDate(weekOf(trainDay())[0]) - parseDate(w0)) / 864e5 / 7) + 1;
  return {sem: Math.min(BLOCO.weeks, Math.max(1, n)), acabou: n > BLOCO.weeks, reav: addDays(w0, BLOCO.weeks * 7)};
}
// Valor curto + complemento da meta de peso ("+0,16 a +0,32 kg" / "por semana")
function metaPeso(p){
  const t = META_PESO[p]?.txt; if (!t) return null;
  const m = t.match(/^(.*?) \((.*)\)$/);
  return t.endsWith(" por semana") ? [t.replace(" por semana", ""), "por semana"] : m ? [m[1], m[2]] : [t, ""];
}
function renderPerfil(){
  const p = person.id, g = GOALS[p] || GOALS.a3, hoje = trainDay(), cor = `var(${person.cor || "--lime"})`;
  const pesos = lastDays(30).map(d => ({d, v: pesoAt(p, d)})).filter(x => x.v);
  const total = Object.values(LOGS).filter(x => x && x.person === p && trained(p, x.date)).length;
  const semana = weekOf(hoje).slice(0, 5).filter(d => trained(p, d)).length, dias = person.days ? person.days.length : 0;
  const atual = streakOf(p), recorde = bestStreak(p), bl = blocoInfo();
  // Peso: último registro e quanto andou desde o registro de ~1–2 semanas antes
  let pesoV = "—", pesoS = "registre no Hoje";
  if (pesos.length) {
    const ult = pesos[pesos.length - 1], ant = pesos.filter(x => x.d >= addDays(ult.d, -14) && x.d <= addDays(ult.d, -5)).sort((x, y) => Math.abs(parseDate(x.d) - parseDate(addDays(ult.d, -7))) - Math.abs(parseDate(y.d) - parseDate(addDays(ult.d, -7))))[0];   // o mais perto de 7 dias antes
    pesoV = kg1(ult.v) + " kg";
    if (ant) { const dlt = ult.v - ant.v, nd = Math.round((parseDate(ult.d) - parseDate(ant.d)) / 864e5); pesoS = (Math.abs(dlt) < 0.05 ? "estável" : (dlt > 0 ? "+" : "−") + kg1(Math.abs(dlt)) + " kg") + ` em ${nd} dias`; }
    else pesoS = ult.d === hoje ? "registrado hoje" : "em " + dm(ult.d);
  }
  const meta = (ico, c, l, v, sub = "") => `<li style="--c:${c}"><span class="ico">${ico}</span><span class="mt-l">${l}${sub ? `<small>${sub}</small>` : ""}</span><b>${v}</b></li>`;
  const mp = metaPeso(p), treinoHoje = !!dayIdFor(hoje);
  const segs = Array.from({length: BLOCO.weeks}, (_, i) => `<i class="${i < bl.sem - 1 || bl.acabou ? "ok" : i === bl.sem - 1 ? "now" : ""}"></i>`).join("");
  return `<section class="list perfil" style="--pc:${cor}">
    <div class="pf-top"><button type="button" class="ghost back" data-screen="hoje" aria-label="Voltar para o Hoje">‹</button><p class="eyebrow">Meu perfil</p></div>
    <article class="panel pf-hero">
      <div class="pf-id"><span class="avatar big" style="--av:${cor}" aria-hidden="true">${person.name.slice(0, 1)}</span><div><h2>${person.name}</h2><p class="pf-goal">${person.goal || "Ficha em construção: falta a avaliação"}</p></div></div>
      ${person.days ? `<div class="pf-bloco"><div class="pf-bl-h"><b>Bloco 1 · ${person.bloco}</b><span>${bl.acabou ? "terminou" : `semana ${bl.sem} de ${BLOCO.weeks}`}</span></div><div class="pf-segs" aria-hidden="true">${segs}</div><small>${bl.acabou ? "Hora da reavaliação: medidas, peso e cargas" : `Reavaliação a partir de ${dm(bl.reav)} · treino de seg a sex`}</small></div>` : ""}
    </article>
    <article class="panel"><h3>Trocar de perfil</h3><div class="pf-swap">${PEOPLE.map(x => `<button type="button" class="pf-p" data-person="${x.id}" aria-pressed="${x.id === p}" aria-label="${x.id === p ? "Você está no perfil " + x.art + " " + x.name : "Trocar para " + x.name}"><span class="avatar sm" style="--av:var(${x.cor || "--lime"})" aria-hidden="true">${x.name.slice(0, 1)}</span><span>${x.name}</span></button>`).join("")}</div></article>
    ${person.days ? `<div class="tiles">${tile(`${semana}<small>/${dias}</small>`, "treinos nesta semana", semana >= dias ? "semana completa" : `faltam ${dias - semana}`)}${tile(atual, atual === 1 ? "dia de ofensiva" : "dias de ofensiva", `recorde: ${recorde}`)}${tile(pesoV, "peso", pesoS)}${tile(total, total === 1 ? "treino no total" : "treinos no total", "desde " + dm(BLOCO.start))}</div>` : ""}
    <article class="panel"><h3>Minhas metas</h3><ul class="pf-metas">
      ${meta(ICON.agua, "var(--blue)", "Água", ml(treinoHoje ? g.aguaTreino : g.aguaDescanso) + " ml", treinoHoje ? `em dia de treino, como hoje<br>descanso: ${ml(g.aguaDescanso)} ml` : `em dia de descanso, como hoje<br>treino: ${ml(g.aguaTreino)} ml`)}
      ${meta(ICON.sono, "var(--sono)", "Sono", g.sono + " h", "mínimo " + g.sonoMin + " h")}
      ${meta(ICONF, "#FF9F43", "Calorias", KCAL[p] || "a definir", KCAL[p] ? "por dia" : "depois da avaliação")}
      ${meta(ICON.prato, "var(--coral)", "Proteína", PROT[p] || "a definir", PROT[p] ? "por dia · mais creatina 3–5 g" : "depois da avaliação")}
      ${mp ? meta(ICON.balanca, "var(--ink)", "Peso", mp[0], mp[1]) : ""}
    </ul><p class="hint">Metas do agente de nutrição do seu personal. São um ponto de partida: ajuste pela média do peso em 2–3 semanas (±100–150 kcal).</p></article>
    <h3 class="pf-sec">Guias</h3>
    <div class="menu">${EXTRA.map(t => `<button type="button" data-screen="${t.id}"><span>${t.name}<small>${GUIA_DESC[t.id] || ""}</small></span><span aria-hidden="true">›</span></button>`).join("")}</div>
  </section>`;
}
function renderMais(){
  const desc = {dieta:"Calorias, proteína e suplementos", regras:"Sobrar, falha, drop, progressão e deload", medidas:"Peso, medidas e próxima avaliação", breno:"O que veio dos vídeos do Breno Aceti"};
  return `<section class="list"><h2>Mais</h2><div class="menu">${EXTRA.map(t => `<button type="button" data-screen="${t.id}"><span>${t.name}<small>${desc[t.id] || ""}</small></span><span aria-hidden="true">›</span></button>`).join("")}</div></section>`;
}
let shownStats = "";
function refreshStats(){
  if (screen !== "perfil" && screen !== "progresso") return;
  const h = screen === "perfil" ? renderPerfil() : renderProgress();
  const sem = x => x.replace(/fld+/g, "");   // ids dos gradientes da chama mudam a cada render
  if (sem(h) === sem(shownStats)) return;
  const y = scrollY; view.innerHTML = shownStats = h; window.scrollTo(0, y);
}
function draw(){
  drawWho(); drawHead(); drawTabs(); drawDock();
  if (screen === "hoje") { view.innerHTML = renderToday(); refreshToday(); return; }
  if (screen === "mais") { screen = "perfil"; }
  if (screen === "progresso") { view.innerHTML = shownStats = renderProgress(); return; }
  if (screen === "perfil") { view.innerHTML = shownStats = renderPerfil(); return; }
  if (EXTRA.find(t => t.id === screen)) { view.innerHTML = `<button type="button" class="ghost back" data-screen="perfil">‹ Perfil</button>` + (person.panels || PANELS)[screen]; return; }
  if (!person.days){ view.innerHTML = PENDING(person); return; }
  if (treinoView === "semana") { view.innerHTML = renderSemana(); return; }
  if (!person.days.find(t=>t.id===current)) current = "d1";
  view.innerHTML = renderDay(person.days.find(x=>x.id===current));
  refreshCarga();
  const kc = document.getElementById("daykcal"), dc = LOGS[docId(person.id, logDate)]; if (kc) kc.textContent = dc && trained(person.id, logDate) && sessionStats(person.id, dc).kcal ? "~" + sessionStats(person.id, dc).kcal + " kcal" : "";
}
function showTip(t){ const c = t.closest(".chart"), tip = c.querySelector(".tip"), r = t.getBoundingClientRect(), cr = c.getBoundingClientRect(); tip.textContent = t.dataset.tip; tip.hidden = false; tip.style.left = Math.min(Math.max(0, r.left - cr.left + r.width / 2 - tip.offsetWidth / 2), cr.width - tip.offsetWidth) + "px"; }
view.addEventListener("pointerover", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t); });
view.addEventListener("pointerout", e => { const t = e.target.closest("[data-tip]"); if (t && e.pointerType === "mouse") t.closest(".chart").querySelector(".tip").hidden = true; });
const goScreen = s => { if (s === "treino") { treinoView = "dia"; current = dayIdFor(logDate) || current; } screen = s; store.set("screen", s); draw(); window.scrollTo({top:0}); };
dock.addEventListener("click", e => { const b = e.target.closest("[data-screen]"); if (b) goScreen(b.dataset.screen); });
document.getElementById("perfilbtn").addEventListener("click", () => goScreen("perfil"));
view.addEventListener("input", e => { if (e.target.closest(".lg")) onLogInput(e.target); });
view.addEventListener("change", e => { if (e.target.id === "peso") { const v = Number(e.target.value.trim().replace(",", ".")); setChk({peso: v > 20 && v < 300 ? Math.round(v * 10) / 10 : null}); return; } if (e.target.id === "logdate" && e.target.value) { logDate = e.target.value; keepDate(logDate); current = dayIdFor(logDate) || current; draw(); } });
who.addEventListener("click", e=>{
  const btn = e.target.closest("[data-person]"); if(!btn) return;
  person = PEOPLE.find(p=>p.id===btn.dataset.person); store.set("person", person.id);
  current = dayIdFor(logDate) || store.get("tab:"+person.id) || "d1"; draw();
});
tabs.addEventListener("click", e=>{
  const btn = e.target.closest("[data-tab]"); if(!btn) return;
  current = btn.dataset.tab; store.set("tab:"+person.id, current); draw();
  window.scrollTo({top:0});
});
view.addEventListener("click", e=>{
  const semana = e.target.closest("[data-semana]");
  if (semana){ treinoView = "semana"; draw(); window.scrollTo({top:0}); return; }
  const dayCard = e.target.closest("[data-day]");
  if (dayCard){ current = dayCard.dataset.day; logDate = weekOf(logDate)[+current.slice(1) - 1]; keepDate(logDate); treinoView = "dia"; draw(); window.scrollTo({top:0}); return; }
  const zoom = e.target.closest("[data-zoom]");
  if (zoom){ const f = zoom.closest(".ex").querySelector(".zoom"); if (f) f.hidden = !f.hidden; return; }
  const jump = e.target.closest("[data-jump]");
  if (jump){ document.getElementById(jump.dataset.jump)?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"}); return; }
  const pb = e.target.closest("[data-pbar]");
  if (pb){ painelSel = pb.dataset.pbar; const y = scrollY; draw(); scrollTo(0, y); return; }
  const prof = e.target.closest("[data-perfil]");
  if (prof){ goScreen("perfil"); return; }
  const pick = e.target.closest("[data-person]");
  if (pick){ person = PEOPLE.find(x => x.id === pick.dataset.person); store.set("person", person.id); current = dayIdFor(logDate) || "d1"; goScreen("hoje"); return; }
  const sc = e.target.closest("[data-setctl]");
  if (sc){ changeSets(+sc.dataset.ex, +sc.dataset.setctl); return; }
  const sheetBtn = e.target.closest("[data-sheet]");
  if (sheetBtn){ openSheet(sheetBtn.dataset.sheet); return; }
  const sq = e.target.closest("[data-sq]");
  if (sq){ const v = +sq.dataset.sq; setChk({sono_q: chkOf(person.id, logDate).sono_q === v ? null : v}); return; }
  const di = e.target.closest("[data-dieta]");
  if (di){ const v = +di.dataset.dieta, c = chkOf(person.id, logDate); setChk({dieta: c.dieta != null && +c.dieta === v ? null : v}); return; }
  const fl = e.target.closest("[data-flag]");
  if (fl){ const f = fl.dataset.flag; setChk({[f]: !chkOf(person.id, logDate)[f]}); return; }
  const nav = e.target.closest("[data-screen]");
  if (nav){ goScreen(nav.dataset.screen); return; }
  const dayBtn = e.target.closest("[data-date]");
  if (dayBtn){ logDate = dayBtn.dataset.date; keepDate(logDate); current = dayIdFor(logDate) || current; draw(); return; }
  const cheer = e.target.closest("[data-cheer]");
  if (cheer){ celebrate(cheer.dataset.cheer); return; }
  const ck = e.target.closest("[data-ck]");
  if (ck){ writeChk(ck.dataset.ck, +ck.dataset.d); return; }
  const wa = e.target.closest("#sendwa"), cp = e.target.closest("#copytxt");
  if (wa || cp){
    const t = treinoText(), sum = document.getElementById("sendsum");
    if (!t){ e.preventDefault(); sum.textContent = "Nada anotado ainda: preencha kg e reps ou marque ✓ em alguma série."; return; }
    if (wa){ wa.href = "https://wa.me/?text=" + encodeURIComponent(t); return; }
    const box = document.getElementById("sendtxt"), showBox = () => { box.hidden = false; box.value = t; box.focus(); box.select(); sum.textContent = "Selecionei o texto: toque e segure para copiar."; };
    try { navigator.clipboard.writeText(t).then(() => { sum.textContent = "Copiado. Cole no WhatsApp ou no chat."; }, showBox); } catch(err){ showBox(); }
    return;
  }
  const set = e.target.closest(".set");
  if (set){
    const k = markKey(current), m = getMarks(k), key = set.dataset.ex+"-"+set.dataset.s;
    m[key] = set.getAttribute("aria-pressed") !== "true"; store.set(k, m);
    const d = person.days.find(x=>x.id===current), i = +set.dataset.ex, [, n, , , rest] = d.ex[i];
    set.setAttribute("aria-pressed", String(m[key]));
    set.closest(".lg")?.querySelectorAll(`input[data-set="${set.dataset.s}"]`).forEach(x => x.classList.toggle("ok", m[key]));
    set.closest(".ex").classList.toggle("done", Array.from({length:n}).every((_, s) => m[i+"-"+s]));
    if (m[key] && set.closest(".lg")) autofill(set);
    if (set.closest(".lg")) writeSet(d.ex[i][0], n, +set.dataset.s, {done: m[key]});
    if (m[key] && rest) startTimer(rest);
    return;
  }
  if (e.target.id==="reset"){ const k = markKey(current); MARKS[k] = {}; store.set(k, {}); draw(); }
});

// Timer
const clock = document.getElementById("clock"), fill = document.getElementById("barfill");
let endAt = 0, total = 0, tick = null, actx = null;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(t=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.2, actx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+t+0.2);
      o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.2);
    });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
function startTimer(sec){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume && actx.resume(); }catch(e){}
  total = sec; endAt = Date.now() + sec*1000; clock.classList.remove("zero");
  clearInterval(tick); update(); tick = setInterval(update, 250);
}
function update(){
  const left = Math.max(0, Math.ceil((endAt - Date.now())/1000));
  clock.textContent = fmt(left);
  fill.style.width = total ? ((total-left)/total*100)+"%" : "0";
  if (left===0 && tick){ clearInterval(tick); tick=null; clock.classList.add("zero"); clock.textContent="Vai!"; beep(); }
}
document.querySelectorAll(".timer [data-t]").forEach(bt=>bt.addEventListener("click",()=>startTimer(+bt.dataset.t)));
document.getElementById("stop").addEventListener("click",()=>{ clearInterval(tick); tick=null; total=0; clock.textContent="0:00"; clock.classList.remove("zero"); fill.style.width="0"; });

draw();
</script>
